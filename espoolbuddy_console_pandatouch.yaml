################################################################################
# SpoolBuddy Console — EXPERIMENTAL port to BigTreeTech Panda Touch
#
# This is a quick "does the UI boot" test on different hardware. It reuses
# espoolbuddy/app.yaml and lvgl.yaml UNCHANGED — the
# shared LVGL package is resolution-independent (flex/grid + the
# screen_width/screen_height/screen_rotation substitutions below), so this
# file only needs to supply this board's hardware config, not a second UI.
#   - NFC: an external PN532 (set to I2C mode) on the rear I2C port (P2)
#     (I2C1: SDA=GPIO4, SCL=GPIO3). No free GPIO is left for its IRQ line, so
#     the reader runs in polling mode. Without a PN532 attached the console
#     still boots normally; NFC is just reported as not OK.
#   - No speaker on Panda Touch. Unlike the console build, this file does not
#     declare a speaker/rtttl/i2s_audio stack and does not pass speaker_id to
#     bambuddy_api — the component gracefully no-ops the chime calls and the
#     Sound setting hides itself at boot.
#   - Hardware: BigTreeTech Panda Touch (ESP32-S3, 8MB octal PSRAM,
#     800x480 RGB565 parallel LCD, GT911 capacitive touch)
#     ref: https://github.com/bigtreetech/PandaTouch_IDF/blob/master/docs/pinout.md
################################################################################
substitutions:
  # Branch/tag/commit fetched for the components + espoolbuddy packages
  # below. Pin to a release tag instead of tracking main if you want
  # reproducible builds.
  espoolbuddy_ref: main
  # Screen geometry consumed by espoolbuddy/lvgl.yaml's root page and
  # lvgl: rotation — everything below the root sizes itself relative to its
  # parent (flex/grid/pct), so these are the only resolution-specific values
  # that need to change per console variant.
  screen_width: "800"
  screen_height: "480"
  screen_rotation: "0"

esphome:
  name: espoolbuddy-console-pandatouch
  friendly_name: ESPoolBuddy Console (Panda Touch)
  project:
    name: espoolbuddy.console
    # Version is centralized in espoolbuddy/version.yaml (see packages: below).
  on_boot:
    - priority: 600
      then:
        - logger.log: "SpoolBuddy booting..."
        - lambda: bambuddy->configure_pm(false);
    - priority: -100
      then:
        - script.execute: apply_tab

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  variant: ESP32S3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      CONFIG_PM_ENABLE: "y"
      CONFIG_FREERTOS_USE_TICKLESS_IDLE: "1"
      # Run code and read-only data from PSRAM instead of flash. Flash writes
      # (OTA, NVS/preferences saves) disable the flash cache; with these the
      # RGB panel driver keeps running meanwhile, so the panel doesn't lose sync.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # -O2 instead of -Os: faster LVGL rendering and JSON parsing at the cost
      # of a larger binary (plenty of room in 16 MB flash).
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
    advanced:
      # ESPHome's own "loopTask" (esp32/core.cpp) runs setup()/App.loop() —
      # including lv_timer_handler() and every interval lambda — on a
      # statically-sized stack independent of ESP-IDF's main-task stack
      # (CONFIG_ESP_MAIN_TASK_STACK_SIZE does NOT apply to it, confirmed via a
      # real "stack overflow in task loopTask" crash). Default is 8192 B. The
      # flex/grid UI conversion added several more nested layout: containers
      # (AMS row -> slot -> icon stack, NFC action row, header sub-rows,
      # settings rows), deepening LVGL's recursive layout/style recalculation
      # on every lv_timer_handler() call enough to overflow the default.
      loop_task_stack_size: 16384

# Panda Touch ships 8MB Octal PSRAM (GPIO33-37 reserved internally for it —
# unlike the console board, which runs quad mode and frees those pins for I2S).
psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: git
      url: https://github.com/CSchlipp/espoolbuddy.git
      ref: ${espoolbuddy_ref}
      path: components
    components: [bambuddy_api, bambuddy_nfc]
    refresh: always

packages:
  espoolbuddy:
    url: https://github.com/CSchlipp/espoolbuddy.git
    ref: ${espoolbuddy_ref}
    path: espoolbuddy
    files: [version.yaml, app.yaml, assets.yaml, lvgl.yaml]
    refresh: always

logger:
  # Global level must be DEBUG so the Bambuddy components can emit DEBUG (a
  # per-tag level may only be RAISED above the global level, never lowered).
  # The noisy framework tags are raised back to INFO to keep the log readable
  # while still tracing all Bambuddy HTTP requests/responses and NFC detail.
  # Change to DEBUG if required
  level: INFO
  # Panda Touch's USB-C port goes through its CH340K bridge to UART0
  # (GPIO43/44). ESPHome otherwise defaults ESP32-S3 logging to the native
  # USB_SERIAL_JTAG peripheral, which is not connected to that port.
  hardware_uart: UART0
  baud_rate: 115200
  logs:
    scheduler: INFO
    component: INFO
    sensor: INFO
    light: INFO
    lvgl: INFO
    touchscreen: INFO
    wifi: INFO
    api: INFO
    ota: INFO
    mdns: INFO
    # ESP-IDF TLS/HTTP internals: expected errors when backend is temporarily
    # unreachable (select timeout, connection refused). Raising to WARN keeps
    # the log clean without hiding our own bambuddy_* DEBUG traces.
    esp-tls: WARN
    transport_base: WARN
    HTTP_CLIENT: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  # Fallback hotspot: if the configured SSID can't be joined, the console comes
  # up as its own AP so captive_portal below can serve the WiFi setup page —
  # without this the portal is compiled in but unreachable.
  ap:
    ssid: "ESPoolBuddy Panda"
    password: !secret ap_fallback_password
  on_connect:
    - logger.log: "WiFi connected"
  on_disconnect:
    - logger.log: "WiFi disconnected"

captive_portal:

ota:
  - platform: esphome
    # No password: a bare encryption block inherits the api encryption key
    # below, which both authenticates the uploader and encrypts the upload.
    # Cheaper than the password handshake (~3.5 KB flash, 60 B RAM).
    encryption:
    # This board drives its RGB panel directly from a continuously-scanned
    # PSRAM framebuffer; a stalled main loop during the flash write shows up
    # as visible glitching. Blank the backlight for the duration so nothing
    # is visible, and restore it on any outcome that doesn't reboot.
    on_begin:
      - lambda: |-
          id(backlight_pwm).set_level(0.0f);
    on_error:
      - lambda: |-
          id(backlight_pwm).set_level(id(backlight_brightness_pct) / 100.0f);
    on_abort:
      - lambda: |-
          id(backlight_pwm).set_level(id(backlight_brightness_pct) / 100.0f);

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# ============================================================================
# Time — SNTP (NTP) clock shown in the header. Non-Home-Assistant source; kept
# on the ESP32-S3 internal RTC between syncs (not battery-backed, so the header
# shows --:-- until the first sync after boot). Default servers: pool.ntp.org.
# The timezone is detected from the build host — see below.
# ============================================================================
time:
  - platform: sntp
    id: sntp_time
    # timezone is deliberately omitted: ESPHome bakes in the zone of the machine
    # running the compile (tzlocal, e.g. /etc/localtime). Set it explicitly here
    # — timezone: Europe/Berlin — when the build host is in a different zone
    # than the console, or when building somewhere with no host zone to detect
    # (a bare container will silently give you UTC).

# ============================================================================
# I2C buses (Panda Touch pinout)
# ============================================================================
i2c:
  # I2C0 — GT911 touch controller (onboard)
  - id: i2c_bus
    sda: GPIO2
    scl: GPIO1
    frequency: 400000

  # I2C1 — rear I2C port (P2, next to the power switch), external PN532 NFC reader
  - id: nfc_i2c
    sda: GPIO4
    scl:
      number: GPIO3
      # GPIO3 is the JTAG-source strapping pin, but it is only sampled at reset
      # — the I2C driver takes it over long after that, so the warning does
      # not apply.
      ignore_strapping_warning: true
    frequency: 100kHz   # PN532 allows up to 400kHz; 100kHz is safer over an external cable
    timeout: 10ms       # PN532 stretches SCL while preparing a response

# ============================================================================
# BambuddyNFC — PN532 via I2C (rear I2C port)
# ============================================================================
bambuddy_nfc:
  id: nfc_reader
  api_id: bambuddy     # id of the bambuddy_api: component below (required link)
  interface: i2c
  i2c_id: nfc_i2c
  # address: 0x24      # PN532 default
  # No irq_pin: the I2C port exposes only SDA/SCL, so ready-detection polls the status byte.
  poll_interval: 300   # ms between detect cycles (no IRQ, so this is always used)
  miss_threshold: 3    # consecutive no-tag responses before declaring tag removed

# ============================================================================
# Sensors
# ============================================================================
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 300s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 300s

# ============================================================================
# Buttons
# ============================================================================
button:
  - platform: template
    name: "Tare Scale"
    id: tare_button
    on_press:
      then:
        - lambda: bambuddy->request_tare();

  - platform: restart
    name: "Restart"
    id: restart_button

# ============================================================================
# Backlight — Panda Touch backlight PWM
# ============================================================================
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0ms

# ============================================================================
# Display — Panda Touch 800x480 RGB565 parallel panel, DE mode. hsync_pin/
# vsync_pin are omitted (not physically wired, and optional in DE mode per
# the mipi_rgb driver — it configures GPIO_NUM_NC for both when unset). The
# hsync/vsync pulse-width and porch values below are still required — they
# drive the RGB peripheral's internal timing generator independently of
# whether the sync signals are exposed on actual pins.
# ============================================================================
display:
  - platform: mipi_rgb
    model: RPI
    id: main_display
    update_interval: never
    dimensions:
      width: ${screen_width}
      height: ${screen_height}
    de_pin: GPIO38
    pclk_pin: GPIO5
    pclk_frequency: 14.5MHz
    hsync_pulse_width: 4
    hsync_back_porch: 8
    hsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    reset_pin:
      number: GPIO46
      # GPIO46 is a boot-mode strapping pin, but the Panda Touch wires it to the
      # panel's reset line. It is only sampled at reset, well before the display
      # driver ever drives it, so the strapping warning does not apply.
      ignore_strapping_warning: true
    color_order: RGB
    auto_clear_enabled: false
    data_pins:
      red:
        - GPIO6   # R3
        - GPIO7   # R4
        - GPIO8   # R5
        - GPIO9   # R6
        - GPIO10  # R7
      green:
        - GPIO11  # G2
        - GPIO12  # G3
        - GPIO13  # G4
        - GPIO14  # G5
        - GPIO15  # G6
        - GPIO16  # G7
      blue:
        - GPIO17  # B3
        - GPIO18  # B4
        - GPIO48  # B5
        - GPIO47  # B6
        - GPIO39  # B7

# ============================================================================
# Touch — GT911 (Panda Touch pinout)
# ============================================================================
touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: i2c_bus
    interrupt_pin: GPIO40
    reset_pin: GPIO41
    on_touch:
      - lambda: |-
          id(display_backlight).turn_on()
            .set_brightness(id(backlight_brightness_pct) / 100.0f)
            .set_transition_length(0).perform();

# ============================================================================
# BambuddyAPI — No speaker on Panda Touch, so speaker_id is omitted
# ============================================================================
bambuddy_api:
  id: bambuddy
  backend_url: !secret bambuddy_backend_url   # Bambuddy server base URL, e.g. http://192.168.1.50:5000
  api_key: !secret bambuddy_api_key           # from Bambuddy → Settings → Devices → this device's API key
  hostname: "SpoolBuddy-Console-PandaTouch"   # display name for this device in Bambuddy's device list (not the network/mDNS hostname)
  backlight_id: display_backlight             # id of the `light:` below — dimmed/turned off by the sleep state machine
  scale:
    type: remote                # weight pushed by a separate scale device (espoolbuddy_scale.yaml)
    # timeout: 10s              # no push for this long → "No scale connected" (default: 10s)
  heartbeat_interval: 10        # seconds — tag scan triggers an extra immediate heartbeat
  # heartbeat_fail_threshold: 3   # consecutive failed heartbeats before cloud/WiFi icons go red (default: 3)
  printer_poll_interval: 15     # seconds between AMS/printer status polls to Bambuddy
  sleep_factor: 12               # heartbeat/poll multiplier while asleep (×12: 10s→120s, 15s→180s); sleep_timeout set at runtime in app.yaml
