name: ESPHome Compile

# Compile-checks the real firmware configs against the latest ESPHome release.
#
# espoolbuddy_console.yaml / espoolbuddy_scale.yaml are standalone copy & paste
# examples: their inline external_components block fetches the bambuddy_api /
# bambuddy_nfc components, their packages block fetches the espoolbuddy/
# UI/app YAMLs, and espoolbuddy/assets.yaml downloads the UI images — all from
# this repo's main branch on GitHub. To test the code under review instead of
# main, the "Build local components" step below rewrites all three to local
# sources before compiling. The rewrite asserts the expected blocks are
# present, so it fails loudly if the configs' external_components or packages
# block, or assets.yaml's image base, is ever changed without updating CI.
#
# Email noise is kept low by only running on pull requests and pushes to main
# (not every feature-branch push), skipping doc-only changes via the paths
# filter, and cancelling superseded runs with the concurrency group below.
# Add "[skip ci]" to a commit message to skip a run entirely.

on:
  push:
    branches: [main]
    paths: &config_paths
      - 'components/**'
      - 'espoolbuddy/**'
      - 'espoolbuddy_console.yaml'
      - 'espoolbuddy_console_pandatouch.yaml'
      - 'espoolbuddy_console_scale.yaml'
      - 'espoolbuddy_console_lite.yaml'
      - 'espoolbuddy_scale.yaml'
      - 'secrets.yaml.example'
      - '.github/workflows/esphome-compile.yml'
      - '.github/scripts/use_local_components.py'
      - '.github/legacy/**'
      - 'host/**'
  pull_request:
    branches: [main]
    paths: *config_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.config }}${{ matrix.legacy && ' (copied pre-bundle config)' || '' }}${{ matrix.label_printer && format(' + {0} label printer', matrix.label_printer) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Console          = display + LVGL + bambuddy_api (console mode) + bambuddy_nfc
        #                    (SPI), 480x320 WT32-SC01 Plus.
        # Console/Panda    = same shared LVGL UI, 800x480 BigTreeTech Panda
        #                    Touch — exercises the resolution-independent
        #                    layout on a second screen size/board, and
        #                    bambuddy_nfc's I2C transport.
        # Console/Scale    = WT32-SC01 Plus on SpoolmanScale wiring: NAU7802 + PN532
        #                    sharing one I2C bus, scale: local on a console.
        # Console/Lite     = Lite UI bundle (bundles/console_lite.yaml), 172x320
        #                    Waveshare ESP32-S3-Touch-LCD-1.47 — mipi_spi display, external
        #                    axs5106 touch component, bambuddy_nfc over I2C.
        # Scale            = HX711 + status LED + bambuddy_api (console_url + scale: local) + bambuddy_nfc (SPI).
        # Together they cover both build modes of the shared components and
        # both bambuddy_nfc host interfaces.
        #
        # The legacy entry builds .github/legacy/espoolbuddy_console.yaml, a
        # frozen console config from before the bundle files (four-file
        # package list, boot hooks and buttons inline) — what existing users'
        # copied configs still look like — so they can't silently break.
        #
        # Two builds also add an optional label printer package, the way a
        # user adds it next to the bundle (the include entries extend those
        # jobs rather than adding new ones):
        # - Console/Scale + m220 (espoolbuddy/label_printer_m220.yaml): the
        #   fullest config with the largest package (the Bluetooth stack), so
        #   it's the one that would hit flash or RAM limits first.
        # - Console + brother_ql (espoolbuddy/label_printer_brother_ql.yaml):
        #   the network printer, on the plain WT32-SC01 Plus console.
        config:
          - espoolbuddy_console.yaml
          - espoolbuddy_console_pandatouch.yaml
          - espoolbuddy_console_scale.yaml
          - espoolbuddy_console_lite.yaml
          - espoolbuddy_scale.yaml
        legacy: [false]
        include:
          - config: espoolbuddy_console_legacy.yaml
            legacy: true
          - config: espoolbuddy_console_scale.yaml
            label_printer: m220
          - config: espoolbuddy_console.yaml
            label_printer: brother_ql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest ESPHome
        run: pip install -U esphome

      - name: Put the frozen pre-bundle config next to the packages
        if: matrix.legacy
        run: cp .github/legacy/espoolbuddy_console.yaml ${{ matrix.config }}

      - name: Build local components + packages + images instead of the GitHub main source
        run: python .github/scripts/use_local_components.py ${{ matrix.label_printer && format('--label-printer={0}', matrix.label_printer) || '' }} ${{ matrix.config }}

      - name: Cache PlatformIO toolchain & frameworks
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('espoolbuddy_console.yaml', 'espoolbuddy_console_pandatouch.yaml', 'espoolbuddy_console_scale.yaml', 'espoolbuddy_console_lite.yaml', 'espoolbuddy_scale.yaml') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Provide secrets file
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i "s|api_encryption_key: \".*\"|api_encryption_key: \"$(openssl rand -base64 32)\"|" secrets.yaml

      - name: Validate config
        run: esphome config ${{ matrix.config }}

      - name: Compile firmware
        run: esphome compile ${{ matrix.config }}

  # The desktop simulators (host/) build the same UI against
  # host/bambuddy_api_mock.cpp instead of bambuddy_api.cpp. A public method the
  # UI calls without a stub in the mock only fails here, at link time, so they
  # are compiled too. They use the local checkout and need no secrets.yaml.
  simulator:
    name: Compile simulator ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - host/espoolbuddy_console_host.yaml
          - host/espoolbuddy_console_lite_host.yaml
          - host/espoolbuddy_console_host_labels.yaml
          - host/espoolbuddy_console_host_labels_network.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDL2 and latest ESPHome
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          pip install -U esphome

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-host-${{ runner.os }}-${{ hashFiles('host/*.yaml') }}
          restore-keys: |
            platformio-host-${{ runner.os }}-

      - name: Compile simulator
        run: esphome compile ${{ matrix.config }}
