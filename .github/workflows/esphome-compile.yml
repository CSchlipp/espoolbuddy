name: ESPHome Compile

# Compile-checks the real firmware configs against the latest ESPHome release.
#
# spoolbuddy_console.yaml / spoolbuddy_scale.yaml are standalone copy & paste
# examples: their inline external_components block fetches the bambuddy_api /
# bambuddy_nfc components from this repo's main branch on GitHub. To test the
# code under review instead of main, the "Build local components" step below
# rewrites that block to a local ./components source before compiling. The
# rewrite asserts the expected block is present, so it fails loudly if the
# configs' external_components block is ever changed without updating CI.
#
# Email noise is kept low by only running on pull requests and pushes to main
# (not every feature-branch push), skipping doc-only changes via the paths
# filter, and cancelling superseded runs with the concurrency group below.
# Add "[skip ci]" to a commit message to skip a run entirely.

on:
  push:
    branches: [main]
    paths: &config_paths
      - 'components/**'
      - 'espoolbuddy/**'
      - 'spoolbuddy_console.yaml'
      - 'spoolbuddy_scale.yaml'
      - 'secrets.yaml.example'
      - '.github/workflows/esphome-compile.yml'
  pull_request:
    branches: [main]
    paths: *config_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Console = display + LVGL + bambuddy_api (console mode) + bambuddy_nfc.
        # Scale   = HX711 + status LED + bambuddy_api (scale_mode) + bambuddy_nfc.
        # Together they cover both build modes of the shared components.
        config:
          - spoolbuddy_console.yaml
          - spoolbuddy_scale.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest ESPHome
        run: pip install -U esphome

      - name: Build local components instead of the GitHub main source
        run: python .github/scripts/use_local_components.py ${{ matrix.config }}

      - name: Cache PlatformIO toolchain & frameworks
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('spoolbuddy_console.yaml', 'spoolbuddy_scale.yaml') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Provide secrets file
        run: |
          cp secrets.yaml.example secrets.yaml
          sed -i "s|api_encryption_key: \".*\"|api_encryption_key: \"$(openssl rand -base64 32)\"|" secrets.yaml

      - name: Validate config
        run: esphome config ${{ matrix.config }}

      - name: Compile firmware
        run: esphome compile ${{ matrix.config }}
