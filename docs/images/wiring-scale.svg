<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="800" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1b1f23">Scale — ESP32-S3 DevKit ↔ HX711 load cell amp + PN532 NFC (SPI)</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#57606a">Any ESP32-S3 dev board works — adjust GPIOs in spoolbuddy_scale.yaml if yours differs</text>

  <!-- Board -->
  <rect x="70" y="100" width="260" height="590" rx="18" fill="#0969da" stroke="#0550ae" stroke-width="2"/>
  <text x="200" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">ESP32-S3</text>
  <text x="200" y="152" text-anchor="middle" font-size="12" fill="#cfe3ff">DevKitC-1 (headless)</text>

  <!-- Onboard LED callout -->
  <circle cx="200" cy="190" r="9" fill="#39d353" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="216" text-anchor="middle" font-size="11" fill="#eaf2ff">Onboard WS2812</text>
  <text x="200" y="230" text-anchor="middle" font-size="11" fill="#eaf2ff">status LED · GPIO48</text>
  <text x="200" y="244" text-anchor="middle" font-size="10" fill="#cfe3ff">(no wiring needed)</text>

  <!-- HX711 module -->
  <rect x="650" y="120" width="280" height="180" rx="18" fill="#a34ea3" stroke="#7d3a7d" stroke-width="2"/>
  <text x="790" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">HX711</text>
  <text x="790" y="170" text-anchor="middle" font-size="12" fill="#f2dcf2">Load cell amplifier</text>

  <!-- PN532 module -->
  <rect x="650" y="330" width="280" height="330" rx="18" fill="#0f7b6c" stroke="#0b5d52" stroke-width="2"/>
  <text x="790" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">PN532 NFC Reader</text>
  <text x="790" y="382" text-anchor="middle" font-size="12" fill="#c9f0e8">SPI mode</text>

  <!-- HX711 wires: board pad x=330, module pad x=650 -->
  <line x1="330" y1="140" x2="650" y2="140" stroke="#cf222e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="140" r="7" fill="#cf222e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="140" r="7" fill="#cf222e" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="132" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">3.3V/5V</text>
  <text x="660" y="132" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">VCC</text>

  <line x1="330" y1="176" x2="650" y2="176" stroke="#24292f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="176" r="7" fill="#24292f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="176" r="7" fill="#24292f" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="168" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GND</text>
  <text x="660" y="168" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">GND</text>

  <line x1="330" y1="212" x2="650" y2="212" stroke="#0b6e4f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="212" r="7" fill="#0b6e4f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="212" r="7" fill="#0b6e4f" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="204" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO5 · DOUT</text>
  <text x="660" y="204" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">DOUT</text>

  <line x1="330" y1="248" x2="650" y2="248" stroke="#0969da" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="248" r="7" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="248" r="7" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="240" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO4 · SCK</text>
  <text x="660" y="240" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">SCK</text>

  <!-- PN532 wires -->
  <line x1="330" y1="360" x2="650" y2="360" stroke="#cf222e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="360" r="7" fill="#cf222e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="360" r="7" fill="#cf222e" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="352" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">3.3V</text>
  <text x="660" y="352" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">VCC</text>

  <line x1="330" y1="396" x2="650" y2="396" stroke="#24292f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="396" r="7" fill="#24292f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="396" r="7" fill="#24292f" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="388" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GND</text>
  <text x="660" y="388" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">GND</text>

  <line x1="330" y1="432" x2="650" y2="432" stroke="#0969da" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="432" r="7" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="432" r="7" fill="#0969da" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="424" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO15 · SCK</text>
  <text x="660" y="424" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">SCK</text>

  <line x1="330" y1="468" x2="650" y2="468" stroke="#1a7f37" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="468" r="7" fill="#1a7f37" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="468" r="7" fill="#1a7f37" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="460" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO17 · MOSI</text>
  <text x="660" y="460" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">MOSI</text>

  <line x1="330" y1="504" x2="650" y2="504" stroke="#bf8700" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="504" r="7" fill="#bf8700" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="504" r="7" fill="#bf8700" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="496" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO16 · MISO</text>
  <text x="660" y="496" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">MISO</text>

  <line x1="330" y1="540" x2="650" y2="540" stroke="#8250df" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="540" r="7" fill="#8250df" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="540" r="7" fill="#8250df" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="532" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO18 · CS</text>
  <text x="660" y="532" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">SS</text>

  <line x1="330" y1="576" x2="650" y2="576" stroke="#0b6e4f" stroke-width="4" stroke-linecap="round" stroke-dasharray="10,7"/>
  <circle cx="330" cy="576" r="7" fill="#0b6e4f" stroke="#ffffff" stroke-width="2"/>
  <circle cx="650" cy="576" r="7" fill="#0b6e4f" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="568" text-anchor="end" font-size="13" font-weight="600" fill="#1b1f23">GPIO8 · IRQ*</text>
  <text x="660" y="568" text-anchor="start" font-size="13" font-weight="600" fill="#1b1f23">IRQ</text>

  <!-- Legend -->
  <g font-size="12" fill="#1b1f23">
    <rect x="55" y="732" width="14" height="14" rx="3" fill="#cf222e"/><text x="74" y="743">Power</text>
    <rect x="165" y="732" width="14" height="14" rx="3" fill="#24292f"/><text x="184" y="743">Ground</text>
    <rect x="275" y="732" width="14" height="14" rx="3" fill="#0969da"/><text x="294" y="743">SPI Clock</text>
    <rect x="395" y="732" width="14" height="14" rx="3" fill="#1a7f37"/><text x="414" y="743">MOSI</text>
    <rect x="485" y="732" width="14" height="14" rx="3" fill="#bf8700"/><text x="504" y="743">MISO</text>
    <rect x="575" y="732" width="14" height="14" rx="3" fill="#8250df"/><text x="594" y="743">Chip Select</text>
    <rect x="700" y="732" width="14" height="14" rx="3" fill="#0b6e4f"/><text x="719" y="743">IRQ* / DOUT</text>
  </g>
  <text x="500" y="775" text-anchor="middle" font-size="12" fill="#57606a">* IRQ is open-drain — the firmware enables an internal pull-up automatically. Wiring it is optional (falls back to polling every 300 ms if omitted).</text>
  <text x="500" y="793" text-anchor="middle" font-size="11" fill="#8c959f">Load-cell wiring to the HX711 (E+/E-/A+/A-) follows the 4-wire pinout printed on your specific load cell.</text>
</svg>
