################################################################################
# SpoolBuddy Scale — ESPHome Configuration
# Target: ESP32-S3 headless scale device (HX711 + PN532 NFC, no display)
#
# Architecture:
#   • console_url is set — this device does NOT connect to BamBuddy at all.
#     Weight readings and NFC events are PUSHED to the console (port 8080); the
#     console relays them to BamBuddy under its own device_id.
#   • scale: type: local — bambuddy_api reads the HX711 sensor below, applies
#     tare/calibration and detects when the reading has settled.
#   • write_tag / tare / calibrate commands are delivered in the /scale/heartbeat
#     response; the scale performs them locally and pushes the result back.
#   • Tare offset and calibration factor are stored in NVS (namespace "spoolbuddy")
#     so they survive reboots with no server dependency.
#
# Hardware connections (adjust GPIO numbers to match your wiring):
#   Scale:  HX711 (DOUT=GPIO5, CLK=GPIO4)
#   NFC:    PN532 via SPI (SCK=GPIO15, MOSI=GPIO17, MISO=GPIO16, CS=GPIO18, IRQ=GPIO8)
################################################################################

substitutions:
  # Branch/tag/commit fetched for the components + espoolbuddy packages
  # below. Pin to a release tag instead of tracking main if you want
  # reproducible builds.
  espoolbuddy_ref: main

esphome:
  name: espoolbuddy-scale
  friendly_name: ESPoolBuddy Scale
  project:
    name: espoolbuddy.scale
    # Version is centralized in espoolbuddy/version.yaml (see packages: below).
  on_boot:
    priority: 600
    then:
      - logger.log: "SpoolBuddy Scale booting..."

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # Extend the task watchdog — HTTP server callbacks can take a few hundred ms.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"

external_components:
  - source:
      type: git
      url: https://github.com/CSchlipp/espoolbuddy.git
      ref: ${espoolbuddy_ref}
      path: components
    components: [bambuddy_api, bambuddy_nfc]
    refresh: always

packages:
  espoolbuddy:
    url: https://github.com/CSchlipp/espoolbuddy.git
    ref: ${espoolbuddy_ref}
    path: espoolbuddy
    files: [version.yaml]
    refresh: always

logger:
  level: INFO
  baud_rate: 115200

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # Fallback hotspot: if the configured SSID can't be joined, the scale comes
  # up as its own AP so captive_portal below can serve the WiFi setup page —
  # without this the portal is compiled in but unreachable.
  ap:
    ssid: "ESPoolBuddy Scale"
    password: !secret ap_fallback_password
  on_connect:
    - logger.log: "WiFi connected"
  on_disconnect:
    - logger.log: "WiFi disconnected"

captive_portal:

ota:
  - platform: esphome
    # No password: a bare encryption block inherits the api encryption key
    # below, which both authenticates the uploader and encrypts the upload.
    # Cheaper than the password handshake (~3.5 KB flash, 60 B RAM).
    encryption:

# Optional: Home Assistant native API (exposes the sensor entity)
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # scale runs standalone; never reboot just because HA isn't there

# ============================================================================
# BambuddyAPI — pushes to the console
# No backend_url / api_key: setting console_url makes this device push to the
# console instead of talking to Bambuddy.
# ============================================================================
bambuddy_api:
  id: bambuddy
  hostname: "SpoolBuddy-Scale"  # display name sent with every push to the console (not the network/mDNS hostname)
  scale:
    type: local                # weight from the HX711 sensor below; tare/cal kept in NVS
    sensor: spool_weight
    # stable_after: 750ms      # reading counts as settled after this long without a move...
    # stable_band: 0.3         # ...of at least this much (matches the delta filter below)
    # timeout: 5s              # no HX711 reading for this long → console shows "No scale connected"
  scale_report_interval: 100   # ms — weight push cadence to the console
  console_url: "http://espoolbuddy-console.local"   # or a list; first entry is authoritative for commands/LED, rest are push-only
  # console_url:
  #   - "http://espoolbuddy-console.local"
  #   - "http://espoolbuddy-console-2.local"

# ============================================================================
# SPI bus — PN532 NFC reader
# ============================================================================
spi:
  - id: spi_bus
    clk_pin: GPIO15
    mosi_pin: GPIO17
    miso_pin: GPIO16

# ============================================================================
# BambuddyNFC — PN532 NFC reader
# Tag scan / remove events are pushed to the console (/scale/nfc/tag-scanned,
# /scale/nfc/tag-removed).  The console relays them to BamBuddy.
# ============================================================================
bambuddy_nfc:
  id: nfc_reader
  api_id: bambuddy     # id of the bambuddy_api: component above (required link)
  interface: spi       # spi (default) or i2c
  spi_id: spi_bus
  cs_pin: GPIO18
  irq_pin:
    number: GPIO8
    mode: INPUT_PULLUP  # PN532 IRQ is open-drain; pull-up required
  data_rate: 1MHz      # PN532 SPI requirement — don't change without checking the datasheet
  spi_mode: 0          # PN532 SPI requirement — mode 0 (CPOL=0, CPHA=0)
  poll_interval: 300   # ms — used only in fallback polling mode; IRQ mode uses 10ms guard
  miss_threshold: 3    # consecutive no-tag responses before declaring tag removed

# ============================================================================
# Buttons
# ============================================================================
button:
  - platform: template
    name: "Tare Scale"
    id: tare_button
    # local_tare() reads the current ADC reading as the new zero-point and saves
    # it to NVS immediately.  No network call needed.
    on_press:
      then:
        - lambda: bambuddy->local_tare();

  - platform: restart
    name: "Restart"
    id: restart_button

# ============================================================================
# HX711 scale sensor — weight in grams
# ============================================================================
sensor:
  - platform: hx711
    name: "Spool Weight"
    id: spool_weight
    dout_pin: GPIO5
    clk_pin: GPIO4
    gain: 128
    update_interval: 200ms   # 10 SPS = 100 ms/conv; 200 ms gives 100 ms margin
                              # so scheduler jitter (WiFi TX, NFC) never races the ADC
    unit_of_measurement: "g"
    accuracy_decimals: 1
    filters:
      # 1. Median(5): reject spike outliers before they enter the averager.
      #    First value arrives after 3 samples (300 ms); full window at 5 (500 ms).
      - median:
          window_size: 5
          send_every: 1
      # 2. SMA(10): smooth the clean stream over a ~2 s window; emit every 400 ms.
      #    (window_size halved from 20 to 10 because update_interval doubled to
      #    200 ms — keeps the same ~2 s smoothing window, emits every 2 samples.)
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2
      # 3. Load-cell polarity: ADC goes negative when weight is added.
      #    Negate so the rest of the pipeline always operates on positive values.
      #    If readings still go negative under load, remove this filter instead.
      - multiply: -1
      # 4. Coarse ADC → grams mapping (placeholder).
      #    Real zero-point (tare_f) and slope (cal_factor) are stored in NVS and
      #    applied by bambuddy_api; this just needs to be a consistent linear map.
      - calibrate_linear:
          - 0 -> 0
          - 1000000 -> 1000
      # 5. Delta(0.3 g): suppress sub-0.3 g jitter so the displayed value is
      #    rock-solid when the scale is loaded but undisturbed. bambuddy_api
      #    times "stable" from the absence of these emissions (stable_after).
      - delta: 0.3

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 10s

# ============================================================================
# On-board WS2812 RGB LED — status indicator
#   Green = WiFi up + console heartbeat OK (connected)
#   Blue  = WiFi up, but console unreachable
#   Red   = WiFi not connected
# ESP32-S3-DevKitC-1: WS2812B on GPIO48
# ============================================================================
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    internal: true          # not exposed to Home Assistant
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool wifi_ok    = id(wifi_comp).is_connected();
          bool console_ok = bambuddy->is_console_connected(5000);

          // Determine state (0=no WiFi, 1=WiFi only, 2=fully connected)
          int state = !wifi_ok ? 0 : (!console_ok ? 1 : 2);

          // Log on state transitions only
          static int prev_state = -1;
          if (state != prev_state) {
            prev_state = state;
            if (state == 0)
              ESP_LOGI("status_led", "No WiFi — LED red");
            else if (state == 1)
              ESP_LOGI("status_led", "WiFi up, console absent — LED blue");
            else
              ESP_LOGI("status_led", "WiFi up, console connected — LED green");
          }

          float r, g, b;
          if (state == 0) {
            r = 1.0f; g = 0.0f; b = 0.0f;  // red  — no WiFi
          } else if (state == 1) {
            r = 0.0f; g = 0.4f; b = 1.0f;  // blue — WiFi up, console absent
          } else {
            r = 0.0f; g = 1.0f; b = 0.0f;  // green — fully connected
          }
          auto call = id(status_led).turn_on();
          call.set_rgb(r, g, b);
          call.set_brightness(0.15f);        // dim — it's just a status dot
          call.set_transition_length(400);
          call.perform();

