################################################################################
# SpoolBuddy Console — desktop (ESPHome host platform) build for LVGL testing
#
# Runs the full console UI (espoolbuddy/bundles/console_full.yaml) as a native
# Linux/macOS program in an SDL window, so layout and UI logic can be iterated on without
# flashing hardware. Mouse clicks act as touches.
#
# The mock backend, SDL window and "Simulate ..." buttons are shared with the
# Lite simulator and live in host_common.yaml — see there for details. For the
# Lite UI run espoolbuddy_console_lite_host.yaml instead.
#
# Unlike the device configs this one uses the local checkout (components,
# packages and images) rather than GitHub, since it's for testing changes.
#
# Requirements: SDL2 development files (sdl2-config on PATH), e.g.
#   Debian/Ubuntu: sudo apt install libsdl2-dev
#   macOS:         brew install sdl2
#
# Run:
#   esphome run host/espoolbuddy_console_host.yaml
#
# Screen size: change screen_width/screen_height below to try other panels,
# e.g. 480x320 for the WT32-SC01 Plus layout.
################################################################################

substitutions:
  screen_width: "800"
  screen_height: "480"
  # Overrides espoolbuddy/assets.yaml's GitHub image base with the local copy.
  espoolbuddy_images: ../espoolbuddy/images

esphome:
  name: espoolbuddy-host
  friendly_name: ESPoolBuddy Host
  project:
    name: espoolbuddy.console_host

packages:
  common: !include host_common.yaml
  ui:     !include ../espoolbuddy/bundles/console_full.yaml
