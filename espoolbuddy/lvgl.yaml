# ============================================================================
# LVGL — resolution-independent SpoolBuddy UI
#
# Sized/laid out via LVGL flex containers + percentage sizing so the same
# tree works on both the 480x320 WT32-SC01 Plus and a future larger panel.
# Screen width/height/rotation come from the entry-point YAML's
# `substitutions:` block (screen_width/screen_height/screen_rotation) and are
# consumed in exactly two places below: the lvgl: rotation key and the root
# page obj's width/height. Everything below the root sizes relative to its
# parent via flex/percent, not the screen.
#
#   Header       fixed height   title + status message + wifi/api icons
#   Content slot flex_grow: 1   one of 4 stacked containers (Scale/NFC/AMS/Cfg)
#   Bottom nav   fixed height   4 icon buttons
# ============================================================================
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_screen
  # 100% (not the usual 50%): the console needs LVGL software rotation
  # (its native panel is portrait, rotated 90° to landscape — Panda Touch
  # needs no rotation and skips this entirely). Software-rotating a
  # fractional-screen draw buffer means most redraws are stitched from
  # multiple partial, rotated blits; a fresh reveal of an oddly-sized,
  # non-full-width widget (e.g. a 156x51 picker tile) is exactly the kind
  # of partial rect that class of bug tends to hit. A full-frame buffer
  # makes every redraw a single whole-canvas blit, sidestepping it.
  buffer_size: 100%
  color_depth: 16
  rotation: ${screen_rotation}
  bg_color: 0x12121A
  default_font: roboto_16

  style_definitions:
    - id: sty_bar
      bg_color: 0x0D0D16
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: sty_panel
      bg_color: 0x12121A
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: sty_card
      bg_color: 0x1B1B2A
      bg_opa: COVER
      border_width: 0
      radius: 6
      pad_all: 0
    - id: sty_ams_row
      bg_color: 0x1B1B2A
      bg_opa: COVER
      border_width: 1
      border_color: 0x454572
      border_opa: COVER
      radius: 6
      pad_all: 0
    - id: sty_navbtn
      bg_color: 0x0D0D16
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
    - id: sty_accent_btn
      bg_color: 0x1A2A50
      border_color: 0x4A7ACC
      border_width: 1
      text_color: 0x7BB4FF
      radius: 6

  pages:
    - id: main_page
      widgets:
        - obj:
            width: ${screen_width}
            height: ${screen_height}
            bg_color: 0x12121A
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:

              # ---------------- MAIN FLEX COLUMN ----------------
              # Header (fixed height) / content slot (flex_grow, one of 4
              # stacked tab panels shown at a time) / bottom nav (fixed
              # height). Modals and the wake guard are declared as siblings
              # of this wrapper (further down), NOT inside it, so a flex
              # layout on this wrapper doesn't try to stack them as flow
              # items instead of freely positioned overlays.
              - obj:
                  width: 100%
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  layout:
                    type: flex
                    flex_flow: column
                    # Header/content/nav must butt flush -- LVGL's default obj
                    # style has a non-zero pad_row, which otherwise inserts an
                    # unwanted gap between every flex child here and pushes the
                    # bottom nav (and AMS/settings content) off-screen.
                    pad_row: 0
                  widgets:

                    # ---------------- HEADER ----------------
                    # Title (left) + scrolling status message (middle,
                    # flex_grow so it fills whatever space is left) +
                    # wifi/api/scale/printer status icons (right, their own
                    # nested flex row so mutual spacing comes from
                    # pad_column instead of hardcoded x offsets).
                    - obj:
                        width: 100%
                        height: 30
                        styles: sty_bar
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                        pad_left: 8
                        widgets:
                          # "EspoolBuddy" — pun on ESP(32) + SpoolBuddy. The
                          # "Esp" is highlighted via LVGL recolor.
                          - label:
                              text: "#4ECDC4 Esp#oolBuddy"
                              text_font: roboto_20
                              text_color: 0xE0E0FF
                              recolor: true
                          # Clock + status share one flex-grow slot between the
                          # title and the status icons. The UI interval lambda
                          # shows the status message (scrolling) when there is
                          # one, else the clock. This inner obj is NOT itself a
                          # flex container, so the two labels' own align still
                          # works to center them within it.
                          - obj:
                              flex_grow: 1
                              height: 100%
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    id: lbl_status
                                    width: 100%
                                    text: ""
                                    text_font: roboto_12
                                    text_color: 0xCCCCDD
                                    long_mode: SCROLL_CIRCULAR
                                    text_align: CENTER
                                    align: CENTER
                                    hidden: true
                                - label:
                                    id: lbl_clock
                                    width: 100%
                                    text: "--:--"
                                    text_font: roboto_16
                                    text_color: 0xE0E0FF
                                    long_mode: SCROLL_CIRCULAR
                                    text_align: CENTER
                                    align: CENTER
                          - obj:
                              height: 100%
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              pad_right: 4
                              scrollbar_mode: "OFF"
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                                pad_column: 4
                              widgets:
                                - label:
                                    id: ic_wifi
                                    width: 28
                                    text: "\U000F05AA"
                                    text_font: mdi_24
                                    text_color: 0x8585B8
                                - label:
                                    id: ic_api
                                    width: 28
                                    text: "\U000F0164"
                                    text_font: mdi_24
                                    text_color: 0x8585B8
                                - label:
                                    id: ic_scale
                                    width: 28
                                    text: "\U000F0472"
                                    text_font: mdi_24
                                    text_color: 0x8585B8
                                - label:
                                    id: ic_printer
                                    width: 28
                                    text: "\U000F042B"
                                    text_font: mdi_24
                                    text_color: 0x8585B8

                    # ---------------- CONTENT SLOT ----------------
                    # Holds the 4 stacked tab panels (only one visible at a
                    # time via `hidden:` toggled by apply_tab in
                    # app.yaml — untouched here). This obj is NOT
                    # itself a flex container: each panel is width/height
                    # 100% and, with no layout on the parent, defaults to
                    # position (0,0) — i.e. the 4 panels overlap exactly as
                    # they did with explicit x:0/y:0 before.
                    - obj:
                        flex_grow: 1
                        width: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:

                          # ================ CONTENT: SCALE ================
                          - obj:
                              id: content_scale
                              width: 100%
                              height: 100%
                              styles: sty_panel
                              scrollbar_mode: "OFF"
                              hidden: true
                              widgets:
                                # ---- Hero content group — WEIGHT title/value/status,
                                # centered as a block (matches the NFC tab's proven
                                # nfc_spool_box/nfc_unlinked_panel pattern: absolute
                                # align:CENTER above an absolute BOTTOM_MID button row —
                                # not flex-column-with-grow, which could overflow the
                                # panel and clip the button row when content is tall). ----
                                - obj:
                                    id: scale_hero_group
                                    align: CENTER
                                    width: 100%
                                    height: SIZE_CONTENT
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    layout:
                                      type: flex
                                      flex_flow: column
                                      flex_align_cross: center
                                      pad_row: 10
                                    widgets:
                                      - label:
                                          width: 100%
                                          text: "WEIGHT"
                                          text_font: roboto_16
                                          text_color: 0x7B9EFF
                                          text_align: CENTER
                                      - label:
                                          id: lbl_weight
                                          width: 100%
                                          text: ""
                                          text_font: roboto_40
                                          text_color: 0x4ECDC4
                                          text_align: CENTER
                                      # No fixed y any more — this label is a normal
                                      # flex item now. Previously an app.yaml lambda
                                      # repositioned it (lv_obj_set_y 134/80)
                                      # depending on scale-connected state; that
                                      # should become a LV_OBJ_FLAG_HIDDEN toggle
                                      # instead, which flex will reflow around
                                      # automatically (hidden flex items don't
                                      # reserve space).
                                      - label:
                                          id: lbl_weight_stable
                                          width: 100%
                                          text: ""
                                          text_font: roboto_16
                                          text_color: 0x8888AA
                                          text_align: CENTER

                                # ---- Action buttons — pinned to the bottom ----
                                - obj:
                                    align: BOTTOM_MID
                                    y: -6
                                    width: 100%
                                    height: 50
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    pad_left: 8
                                    pad_right: 8
                                    scrollbar_mode: "OFF"
                                    layout:
                                      type: flex
                                      flex_flow: row
                                      pad_column: 8
                                    widgets:
                                      - button:
                                          id: btn_tare
                                          flex_grow: 1
                                          height: 50
                                          styles: sty_accent_btn
                                          on_click:
                                            then:
                                              - lambda: bambuddy->request_tare();
                                          widgets:
                                            - label:
                                                text: "TARE"
                                                text_font: roboto_16
                                                text_color: 0x7BB4FF
                                                align: CENTER
                                      - button:
                                          id: btn_calibrate
                                          flex_grow: 1
                                          height: 50
                                          styles: sty_accent_btn
                                          on_click:
                                            then:
                                              - lambda: |-
                                                  char buf[10];
                                                  snprintf(buf, sizeof(buf), "%.0f g", id(cal_ref_weight));
                                                  lv_label_set_text(id(lbl_cal_weight), buf);
                                                  lv_obj_clear_flag(id(cal_modal), LV_OBJ_FLAG_HIDDEN);
                                          widgets:
                                            - label:
                                                text: "CALIBRATE"
                                                text_font: roboto_16
                                                text_color: 0x7BB4FF
                                                align: CENTER

                          - !include lvgl/tab_nfc.yaml

                          - !include lvgl/tab_ams.yaml

                          # ================ CONTENT: SETTINGS ================
                          - obj:
                              id: content_cfg
                              width: 100%
                              height: 100%
                              styles: sty_panel
                              scrollbar_mode: "OFF"
                              hidden: true
                              widgets:
                                # Non-flex wrapper: holds the normal top-to-
                                # bottom flow (header/separator/menu list).
                                # Kept as a distinct child (rather than making
                                # content_cfg itself flex) so lbl_version and
                                # the 3 full-panel subpage overlays below can
                                # stay freely/absolutely positioned siblings.
                                - obj:
                                    width: 100%
                                    height: 100%
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    layout:
                                      type: flex
                                      flex_flow: column
                                    widgets:
                                      - obj:
                                          width: 100%
                                          height: 28
                                          styles: sty_bar
                                          scrollbar_mode: "OFF"
                                          widgets:
                                            - label:
                                                width: 100%
                                                text: "Settings"
                                                text_font: roboto_20
                                                pad_top: 5
                                                text_color: 0x7B9EFF
                                                text_align: CENTER
                                                align: CENTER
                                      - obj:
                                          width: 100%
                                          height: 1
                                          bg_color: 0x454572
                                          bg_opa: COVER
                                          border_width: 0
                                          radius: 0
                                          scrollbar_mode: "OFF"

                                      # ==== Settings menu: category rows opening full-page subpages ====
                                      - obj:
                                          width: 100%
                                          flex_grow: 1
                                          bg_opa: TRANSP
                                          border_width: 0
                                          pad_left: 8
                                          pad_right: 8
                                          pad_top: 8
                                          scrollbar_mode: "OFF"
                                          layout:
                                            type: grid
                                            grid_columns: ["FR(1)"]
                                            grid_rows: ["FR(1)", "FR(1)", "FR(1)", "FR(1)"]
                                            grid_cell_x_align: stretch
                                            grid_cell_y_align: stretch
                                            pad_row: 10
                                          widgets:
                                            - button:
                                                id: btn_system_page
                                                grid_cell_row_pos: 0
                                                grid_cell_column_pos: 0
                                                styles: sty_card
                                                scrollbar_mode: "OFF"
                                                layout:
                                                  type: flex
                                                  flex_flow: row
                                                  flex_align_cross: center
                                                  flex_align_track: center
                                                pad_left: 16
                                                pad_right: 16
                                                on_click:
                                                  then:
                                                    - lambda: 'lv_obj_clear_flag(id(content_system), LV_OBJ_FLAG_HIDDEN);'
                                                widgets:
                                                  - label: {flex_grow: 1, text: "System", text_font: roboto_16, pad_top: 4, text_color: 0xDDDDEE}
                                                  - label: {text: "\U000F0142", text_font: mdi_24, pad_top: 6, text_color: 0x7B9EFF}
                                            - button:
                                                id: btn_features_page
                                                grid_cell_row_pos: 1
                                                grid_cell_column_pos: 0
                                                styles: sty_card
                                                scrollbar_mode: "OFF"
                                                layout:
                                                  type: flex
                                                  flex_flow: row
                                                  flex_align_cross: center
                                                  flex_align_track: center
                                                pad_left: 16
                                                pad_right: 16
                                                on_click:
                                                  then:
                                                    - lambda: 'lv_obj_clear_flag(id(content_features), LV_OBJ_FLAG_HIDDEN);'
                                                widgets:
                                                  - label: {flex_grow: 1, text: "Features", text_font: roboto_16, pad_top: 4, text_color: 0xDDDDEE}
                                                  - label: {text: "\U000F0142", text_font: mdi_24, pad_top: 6, text_color: 0x7B9EFF}

                                # ---- App version (bottom-left; text set in apply_tab from
                                #      esphome.project.version via ESPHOME_PROJECT_VERSION).
                                #      Absolute sibling — content_cfg has no layout set, so
                                #      x/y/align still apply here unchanged. ----
                                - label:
                                    id: lbl_version
                                    text: ""
                                    text_font: roboto_12
                                    text_color: 0x8585B8
                                    x: 10
                                    y: 6
                                    align: TOP_LEFT

                                # ---- System subpage (overlays full content_cfg area) ----
                                # Printer | Brightness | Sleep (opens the nested content_sleep
                                # subpage) | Reboot (confirms via confirm_modal). Absolute
                                # overlay sibling (width/height 100%, no x/y needed since a
                                # non-flex parent defaults children to (0,0)); flex column
                                # internally for its own header/separator/rows.
                                - obj:
                                    id: content_system
                                    width: 100%
                                    height: 100%
                                    bg_color: 0x12121A
                                    bg_opa: COVER
                                    border_width: 0
                                    radius: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    hidden: true
                                    layout:
                                      type: flex
                                      flex_flow: column
                                      pad_row: 6
                                    widgets:
                                      # Header with back button
                                      - obj:
                                          width: 100%
                                          height: 28
                                          styles: sty_bar
                                          scrollbar_mode: "OFF"
                                          widgets:
                                            - button:
                                                width: 40
                                                height: 28
                                                bg_opa: TRANSP
                                                border_width: 0
                                                radius: 0
                                                pad_all: 0
                                                scrollbar_mode: "OFF"
                                                on_click:
                                                  then:
                                                    - lambda: 'lv_obj_add_flag(id(content_system), LV_OBJ_FLAG_HIDDEN);'
                                                widgets:
                                                  - label: {text: "\U000F0141", text_font: mdi_24, text_color: 0x7B9EFF, align: CENTER}
                                            - label:
                                                width: 100%
                                                text: "System"
                                                text_font: roboto_20
                                                pad_top: 5
                                                text_color: 0x7B9EFF
                                                text_align: CENTER
                                                align: CENTER
                                      # Separator
                                      - obj:
                                          width: 100%
                                          height: 1
                                          bg_color: 0x454572
                                          bg_opa: COVER
                                          border_width: 0
                                          radius: 0
                                          scrollbar_mode: "OFF"

                                      - obj:
                                          id: content_system_rows
                                          width: 100%
                                          flex_grow: 1
                                          bg_opa: TRANSP
                                          border_width: 0
                                          pad_all: 0
                                          scrollbar_mode: "OFF"
                                          layout:
                                            type: grid
                                            grid_columns: ["FR(1)"]
                                            grid_rows: ["FR(1)", "FR(1)", "FR(1)", "FR(1)"]
                                            grid_cell_x_align: stretch
                                            grid_cell_y_align: stretch
                                            pad_row: 6
                                          widgets:
                                            # ---- Row: selected printer (tap the value to open the picker popup) ----
                                            - obj:
                                                grid_cell_row_pos: 0
                                                grid_cell_column_pos: 0
                                                bg_opa: TRANSP
                                                border_width: 0
                                                pad_left: 14
                                                pad_top: 0
                                                pad_bottom: 0
                                                pad_right: 10
                                                scrollbar_mode: "OFF"
                                                layout:
                                                  type: flex
                                                  flex_flow: row
                                                  flex_align_cross: center
                                                  flex_align_track: center
                                                  pad_column: 8
                                                widgets:
                                                  - label:
                                                      width: 110
                                                      text: "Printer"
                                                      text_font: roboto_16
                                                      pad_top: 4
                                                      text_color: 0xAAAAAA
                                                  - button:
                                                      id: btn_printer_pick
                                                      flex_grow: 1
                                                      height: 32
                                                      styles: sty_card
                                                      scrollbar_mode: "OFF"
                                                      layout:
                                                        type: flex
                                                        flex_flow: row
                                                        flex_align_cross: center
                                                        pad_column: 6
                                                      pad_left: 8
                                                      pad_right: 8
                                                      on_click:
                                                        then:
                                                          - lambda: 'lv_obj_clear_flag(id(printer_modal), LV_OBJ_FLAG_HIDDEN);'
                                                      widgets:
                                                        - label: {id: lbl_printer_sel_icon, width: 24, text: "\U000F0765", text_font: mdi_24, pad_top: 6, text_color: 0x666688}
                                                        - label: {id: lbl_printer_sel, flex_grow: 1, text: "—", text_font: roboto_16, pad_top: 4, text_color: 0xDDDDEE, long_mode: DOT}
                                                        - label: {text: "\U000F0142", text_font: mdi_24, pad_top: 6, text_color: 0x7B9EFF}

                                            # ---- Row: Backlight brightness (slider 25–100%, 5% steps) ----
                                            - obj:
                                                grid_cell_row_pos: 1
                                                grid_cell_column_pos: 0
                                                bg_opa: TRANSP
                                                border_width: 0
                                                pad_left: 14
                                                pad_top: 0
                                                pad_bottom: 0
                                                pad_right: 10
                                                scrollbar_mode: "OFF"
                                                layout:
                                                  type: flex
                                                  flex_flow: row
                                                  flex_align_cross: center
                                                  flex_align_track: center
                                                  pad_column: 10
                                                widgets:
                                                  - label:
                                                      width: 130
                                                      text: "Brightness"
                                                      text_font: roboto_16
                                                      pad_top: 4
                                                      text_color: 0xAAAAAA
                                                  - slider:
                                                      id: sl_brightness
                                                      flex_grow: 1
                                                      height: 16
                                                      min_value: 25
                                                      max_value: 100
                                                      value: 100
                                                      on_value:
                                                        then:
                                                          - lambda: |-
                                                              // Snap to 5% steps and store. Inline to avoid circular
                                                              // trigger: update_backlight_brightness → lv_slider_set_value
                                                              // → on_value → update_backlight_brightness → ...
                                                              int snapped = ((x + 2) / 5) * 5;
                                                              if (snapped < 25) snapped = 25;
                                                              if (snapped > 100) snapped = 100;
                                                              id(backlight_brightness_pct) = snapped;
                                                              id(display_backlight).turn_on()
                                                                .set_brightness(snapped / 100.0f)
                                                                .set_transition_length(50).perform();
                                                              char buf[6];
                                                              snprintf(buf, sizeof(buf), "%d%%", snapped);
                                                              lv_label_set_text(id(lbl_brightness_val), buf);
                                                  - label:
                                                      id: lbl_brightness_val
                                                      width: 50
                                                      text: "100%"
                                                      text_font: roboto_16
                                                      pad_top: 4
                                                      text_color: 0xDDDDEE
                                                      text_align: RIGHT

                                            # ---- Row: Sleep settings (opens the nested sleep subpage) ----
                                            - obj:
                                                grid_cell_row_pos: 2
                                                grid_cell_column_pos: 0
                                                bg_opa: TRANSP
                                                border_width: 0
                                                pad_left: 14
                                                pad_top: 0
                                                pad_bottom: 0
                                                pad_right: 10
                                                scrollbar_mode: "OFF"
                                                layout:
                                                  type: flex
                                                  flex_flow: row
                                                  flex_align_cross: center
                                                  flex_align_track: center
                                                  pad_column: 8
                                                widgets:
                                                  - label:
                                                      width: 110
                                                      text: "Sleep"
                                                      text_font: roboto_16
                                                      pad_top: 4
                                                      text_color: 0xAAAAAA
                                                  - button:
                                                      id: btn_sleep_page
                                                      flex_grow: 1
                                                      height: 32
                                                      styles: sty_card
                                                      scrollbar_mode: "OFF"
                                                      layout:
                                                        type: flex
                                                        flex_flow: row
                                                        flex_align_cross: center
                                                      pad_left: 8
                                                      pad_right: 8
                                                      on_click:
                                                        then:
                                                          - lambda: 'lv_obj_clear_flag(id(content_sleep), LV_OBJ_FLAG_HIDDEN);'
                                                      widgets:
                                                        - label: {flex_grow: 1, text: "Sleep settings", text_font: roboto_16, pad_top: 4, text_color: 0xDDDDEE}
                                                        - label: {text: "\U000F0142", text_font: mdi_24, pad_top: 6, text_color: 0x7B9EFF}

                                            # ---- Row: Reboot (confirms via confirm_modal) ----
                                            - obj:
                                                grid_cell_row_pos: 3
                                                grid_cell_column_pos: 0
                                                bg_opa: TRANSP
                                                border_width: 0
                                                pad_left: 14
                                                pad_top: 0
                                                pad_bottom: 0
                                                pad_right: 10
                                                scrollbar_mode: "OFF"
                                                layout:
                                                  type: flex
                                                  flex_flow: row
                                                  flex_align_cross: center
                                                  flex_align_track: center
                                                  pad_column: 8
                                                widgets:
                                                  - label:
                                                      width: 110
                                                      text: "Reboot"
                                                      text_font: roboto_16
                                                      pad_top: 4
                                                      text_color: 0xAAAAAA
                                                  - button:
                                                      id: btn_reboot
                                                      flex_grow: 1
                                                      height: 32
                                                      styles: sty_card
                                                      scrollbar_mode: "OFF"
                                                      on_click:
                                                        then:
                                                          - lambda: |-
                                                              id(confirm_action) = 3;
                                                              lv_label_set_text(id(confirm_msg), "Reboot the console now?");
                                                              lv_label_set_text(id(confirm_ok_lbl), "Reboot");
                                                              lv_obj_clear_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                                                      widgets:
                                                        - label: {text: "Reboot", text_font: roboto_16, pad_top: 4, text_color: 0xFF8888, align: CENTER}

                                # ---- Features subpage (overlays full content_cfg area) ----
                                # Sound | Plate Clear confirmation toggle.
                                - obj:
                                    id: content_features
                                    width: 100%
                                    height: 100%
                                    bg_color: 0x12121A
                                    bg_opa: COVER
                                    border_width: 0
                                    radius: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    hidden: true
                                    layout:
                                      type: flex
                                      flex_flow: column
                                      pad_row: 6
                                    widgets:
                                      # Header with back button
                                      - obj:
                                          width: 100%
                                          height: 28
                                          styles: sty_bar
                                          scrollbar_mode: "OFF"
