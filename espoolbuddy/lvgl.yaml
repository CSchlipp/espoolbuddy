              # ================ CALIBRATION MODAL ============================
              - obj:
                  id: cal_modal
                  width: 85%
                  height: SIZE_CONTENT
                  align: CENTER
                  bg_color: 0x1A1A2C
                  bg_opa: COVER
                  border_color: 0x8585B8
                  border_width: 2
                  border_opa: COVER
                  radius: 12
                  pad_left: 16
                  pad_right: 16
                  pad_top: 12
                  pad_bottom: 12
                  scrollbar_mode: "OFF"
                  shadow_width: 16
                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 10
