                        width: 100%
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_main: center
                          pad_column: 6
                        widgets:
                          - button:
                              id: btn_slot_id_m10
                              width: 60
                              height: 40
                              bg_color: 0x1E1E30
                              border_color: 0x3A3A56
                              border_width: 1
                              radius: 4
                              scrollbar_mode: "OFF"
