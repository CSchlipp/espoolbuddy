                        id: slot_assign_title
                        width: 100%
                        text: "Assign Spool"
                        text_font: roboto_20
                        text_color: 0x7BB4FF
                        long_mode: DOT
                    # ---- ID chooser: -10 / - / ID:X / + / +10 ----
