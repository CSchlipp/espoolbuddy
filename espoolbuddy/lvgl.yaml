                    - label:
                        text: "Calibrate Scale"
                        text_font: roboto_20
                        text_color: 0x7BB4FF
                    - label:
                        width: 100%
                        text: "Place known weight on scale, then confirm."
                        text_font: roboto_12
                        text_color: 0xBBBBCC
                        long_mode: WRAP
                    # ---- Reference weight row: −100 −10 −1 [value] +1 +10 +100 ----
                    # Buttons/value keep their original intrinsic pixel widths
                    # (font-sized number buttons) and are centered as a group
                    # via flex_align_main, rather than stretched to fill.
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: row_wrap
                          flex_align_main: center
                          flex_align_cross: center
                          flex_align_track: center
                          pad_column: 4
                          pad_row: 4
                        widgets:
                          - button:
                              id: btn_cal_m100
                              width: 44
                              height: 36
                              bg_color: 0x252540
                              border_color: 0x8585B8
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      float v = id(cal_ref_weight) - 100.0f;
                                      if (v < 1.0f) v = 1.0f;
                                      id(cal_ref_weight) = v;
                                      char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                      lv_label_set_text(id(lbl_cal_weight), buf);
                              widgets:
                                - label: {text: "-100", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                          - button:
                              id: btn_cal_m10
                              width: 44
                              height: 36
                              bg_color: 0x252540
                              border_color: 0x8585B8
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      float v = id(cal_ref_weight) - 10.0f;
                                      if (v < 1.0f) v = 1.0f;
                                      id(cal_ref_weight) = v;
                                      char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                      lv_label_set_text(id(lbl_cal_weight), buf);
                              widgets:
                                - label: {text: "-10", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                          - button:
                              id: btn_cal_m1
                              width: 44
                              height: 36
                              bg_color: 0x252540
                              border_color: 0x8585B8
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      float v = id(cal_ref_weight) - 1.0f;
                                      if (v < 1.0f) v = 1.0f;
                                      id(cal_ref_weight) = v;
                                      char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                      lv_label_set_text(id(lbl_cal_weight), buf);
                              widgets:
                                - label: {text: "-1", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                          - label:
                              id: lbl_cal_weight
                              width: 80
                              height: 36
                              text: "100 g"
                              text_font: roboto_16
                              text_color: 0x7BB4FF
                              text_align: CENTER
                              align: CENTER
                          - button:
                              id: btn_cal_p1
                              width: 44
                              height: 36
                              bg_color: 0x252540
                              border_color: 0x8585B8
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      float v = id(cal_ref_weight) + 1.0f;
                                      if (v > 5000.0f) v = 5000.0f;
                                      id(cal_ref_weight) = v;
                                      char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                      lv_label_set_text(id(lbl_cal_weight), buf);
                              widgets:
                                - label: {text: "+1", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                          - button:
                              id: btn_cal_p10
                              width: 44
                              height: 36
                              bg_color: 0x252540
                              border_color: 0x8585B8
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      float v = id(cal_ref_weight) + 10.0f;
                                      if (v > 5000.0f) v = 5000.0f;
                                      id(cal_ref_weight) = v;
                                      char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                      lv_label_set_text(id(lbl_cal_weight), buf);
                              widgets:
                                - label: {text: "+10", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                          - button:
                              id: btn_cal_p100
                              width: 44
                              height: 36
                              bg_color: 0x252540
                              border_color: 0x8585B8
                              border_width: 1
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      float v = id(cal_ref_weight) + 100.0f;
                                      if (v > 5000.0f) v = 5000.0f;
                                      id(cal_ref_weight) = v;
                                      char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                      lv_label_set_text(id(lbl_cal_weight), buf);
                              widgets:
                                - label: {text: "+100", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
