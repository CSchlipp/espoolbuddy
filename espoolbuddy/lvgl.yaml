                              height: 40
                              bg_color: 0x1E1E30
                              border_color: 0x3A3A56
                              border_width: 1
                              radius: 4
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      if((int)id(slot_assign_id)>1) id(slot_assign_id)--;
                                      int v=(int)id(slot_assign_id);
                                      char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                              widgets:
                                - label: {text: "-", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                          - label:
                              id: lbl_slot_assign_id
                              width: 176
                              text: "ID: 1"
                              text_font: roboto_20
                              text_color: 0xFFFFFF
                              text_align: CENTER
                              align: CENTER
                          - button:
                              id: btn_slot_id_p1
                              width: 48
                              height: 40
                              bg_color: 0x1E1E30
                              border_color: 0x3A3A56
                              border_width: 1
                              radius: 4
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      id(slot_assign_id)++;
                                      int v=(int)id(slot_assign_id);
                                      char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                              widgets:
                                - label: {text: "+", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                          - button:
                              id: btn_slot_id_p10
                              width: 60
                              height: 40
                              bg_color: 0x1E1E30
                              border_color: 0x3A3A56
                              border_width: 1
                              radius: 4
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      int v=(int)id(slot_assign_id)+10; id(slot_assign_id)=v;
                                      char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                              widgets:
                                - label: {text: "+10", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                    # ---- Assign | Cancel ----
                    - obj:
                        width: 100%
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 8
                        widgets:
                          - button:
                              id: btn_slot_assign_ok
                              flex_grow: 1
                              height: 40
                              bg_color: 0x0D2B14
                              border_color: 0x4CAF50
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      int sid=(int)id(slot_assign_id);
                                      if(sid>0) bambuddy->assign_spool_to_slot(sid, id(modal_ams_id), id(modal_tray_slot));
                                      lv_obj_add_flag(id(assign_id_modal), LV_OBJ_FLAG_HIDDEN);
                              widgets:
                                - label: {text: "Assign", text_font: roboto_16, text_color: 0x4CAF50, align: CENTER}
                          - button:
                              id: btn_slot_assign_cancel
                              flex_grow: 1
                              height: 40
                              bg_color: 0x1E2040
                              border_color: 0x8585B8
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: "lv_obj_add_flag(id(assign_id_modal), LV_OBJ_FLAG_HIDDEN);"
                              widgets:
                                - label: {text: "Cancel", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}

              # ================ PLATE CLEAR POPUP =============================
              # Almost-full-screen confirmation shown when the backend reports
              # awaiting_plate_clear (gated by the "Plate Clear" settings toggle;
              # see plate_clear_confirm_enabled / update_plateclear_btn and the
              # show/hide logic in the interval lambda). Confirm notifies the
              # backend via bambuddy->confirm_plate_cleared(); Discard just
              # closes the popup locally without notifying the backend.
              - obj:
                  id: plate_clear_popup
                  width: 85%
                  height: SIZE_CONTENT
                  align: CENTER
                  bg_color: 0x1B5E20
                  bg_opa: COVER
                  border_color: 0x4CAF50
                  border_width: 3
                  border_opa: COVER
                  radius: 16
                  pad_left: 16
                  pad_right: 16
                  pad_top: 20
                  pad_bottom: 20
                  scrollbar_mode: "OFF"
                  scrollable: false
                  shadow_width: 20
                  shadow_offset_x: 0
                  shadow_offset_y: 8
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 12
                  widgets:
                    - label:
                        text: "\U000F1276"
                        text_font: mdi_48
                        text_color: 0xFFFFFF
                        text_align: CENTER
                    - label:
                        text: "Build Plate Clear"
                        text_font: roboto_28
                        text_color: 0xFFFFFF
                        text_align: CENTER
                    - label:
                        width: 90%
                        text: "Please confirm that the build plate has been cleared."
                        text_font: roboto_16
                        text_color: 0xE8F5E9
                        text_align: CENTER
                        long_mode: WRAP
                    - obj:
                        width: 100%
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 10
                        widgets:
                          - button:
                              id: btn_plateclear_discard
                              flex_grow: 1
                              height: 40
                              bg_color: 0x0F3D14
                              border_color: 0xA5D6A7
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      id(plate_clear_popup_open) = 0;
                                      // Suppress the popup until awaiting_plate_clear is next observed
                                      // false — see the interval lambda in app.yaml.
                                      id(plate_clear_dismissed) = 1;
                                      lv_obj_add_flag(id(plate_clear_popup), LV_OBJ_FLAG_HIDDEN);
                                      bambuddy->dismiss_plate_clear_popup();
                              widgets:
                                - label: {text: "Discard", text_font: roboto_16, text_color: 0xE8F5E9, align: CENTER}
                          - button:
                              id: btn_plateclear_confirm
                              flex_grow: 1
                              height: 40
                              bg_color: 0xFFFFFF
                              border_color: 0xFFFFFF
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      id(plate_clear_popup_open) = 0;
                                      lv_obj_add_flag(id(plate_clear_popup), LV_OBJ_FLAG_HIDDEN);
                                      bambuddy->confirm_plate_cleared();
                              widgets:
                                - label: {text: "Confirm", text_font: roboto_16, text_color: 0x1B5E20, align: CENTER}

              # ================ WAKE GUARD ====================================
              # Full-screen transparent overlay that sits on top of all other
              # widgets. Shown by on_idle when the backlight dims; absorbs the
              # first touch that wakes the screen so underlying buttons aren't
              # accidentally triggered. Hidden again by its own on_click, and
              # also by the weight-placement wake path in app.yaml.
              - obj:
                  id: wake_guard
                  width: 100%
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  scrollable: false
                  hidden: true
                  on_click:
                    then:
                      - lambda: |-
                          lv_obj_add_flag(id(wake_guard), LV_OBJ_FLAG_HIDDEN);
                          // Waking from Dim (not deep sleep): restore user-configured brightness.
                          // Deep-sleep wake is handled by the interval lambda (is_sleeping path).
                          if (!id(is_sleeping)) {
                            id(display_backlight).turn_on()
                              .set_brightness(id(backlight_brightness_pct) / 100.0f)
                              .set_transition_length(150).perform();
                          }

  on_idle:
    timeout: 60s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 20%
          transition_length: 2s
