                              id: btn_cal_cancel
                              flex_grow: 1
                              height: 38
                              bg_color: 0x2A1A1A
                              border_color: 0xCC3333
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: "lv_obj_add_flag(id(cal_modal), LV_OBJ_FLAG_HIDDEN);"
                              widgets:
                                - label: {text: "Cancel", text_font: roboto_16, text_color: 0xFF8888, align: CENTER}
                          - button:
                              id: btn_cal_confirm
