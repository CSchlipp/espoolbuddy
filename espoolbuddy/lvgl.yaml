                  border_width: 2
                  border_opa: COVER
                  radius: 12
                  pad_left: 16
                  pad_right: 16
                  pad_top: 14
                  pad_bottom: 14
                  scrollbar_mode: "OFF"
                  scrollable: false
                  shadow_width: 16
                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
