                                      bambuddy->request_calibration(id(cal_ref_weight));
                              widgets:
                                - label: {text: "Calibrate", text_font: roboto_16, text_color: 0x4ECDC4, align: CENTER}

              # ================ CONFIRM MODAL ================================
              # Reusable confirmation for destructive actions. confirm_action
              # (global) selects what runs on confirm: 1=unlink tag, 2=clear
              # assignment. Declared before the wake guard so it overlays the AMS
              # detail modal (clear assignment is triggered from inside it).
              - obj:
                  id: confirm_modal
                  width: 85%
                  height: SIZE_CONTENT
                  align: CENTER
                  bg_color: 0x1A1A2C
                  bg_opa: COVER
                  border_color: 0x8585B8
                  border_width: 2
                  border_opa: COVER
                  radius: 12
                  pad_left: 16
                  pad_right: 16
                  pad_top: 16
                  pad_bottom: 16
                  scrollbar_mode: "OFF"
                  scrollable: false
                  shadow_width: 16
                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 12
                  widgets:
                    - label:
                        text: "Are you sure?"
                        text_font: roboto_20
                        text_color: 0x7BB4FF
                    - label:
                        id: confirm_msg
                        width: 100%
                        text: ""
                        text_font: roboto_16
                        text_color: 0xDDDDEE
                        long_mode: WRAP
                    - obj:
                        width: 100%
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: row
                          pad_column: 8
                        widgets:
                          - button:
                              id: confirm_cancel_btn
                              flex_grow: 1
                              height: 40
                              bg_color: 0x1E2040
                              border_color: 0x8585B8
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      id(confirm_action) = 0;
                                      lv_obj_add_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                              widgets:
                                - label: {text: "Cancel", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                          - button:
                              id: confirm_ok_btn
                              flex_grow: 1
                              height: 40
                              bg_color: 0x3D0A0A
                              border_color: 0xCC3333
                              border_width: 2
                              radius: 6
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: |-
                                      int a = id(confirm_action);
                                      id(confirm_action) = 0;
                                      lv_obj_add_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                                      if (a == 1) {
                                        bambuddy->unlink_current_tag();
                                      } else if (a == 2) {
                                        bambuddy->clear_slot_assignment(id(modal_ams_id), id(modal_tray_slot));
                                        lv_obj_add_flag(id(ams_modal_card), LV_OBJ_FLAG_HIDDEN);
                                      } else if (a == 3) {
                                        id(restart_button).press();  // reboot the console
                                      }
                              widgets:
                                - label: {id: confirm_ok_lbl, text: "Confirm", text_font: roboto_16, text_color: 0xFF8888, align: CENTER}

              # ================ ASSIGN-BY-ID MODAL ===========================
