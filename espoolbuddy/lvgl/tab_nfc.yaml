obj:
  id: content_nfc
  x: 0
  y: 30
  width: 480
  height: 250
  styles: sty_panel
  scrollbar_mode: "OFF"
  hidden: true
  widgets:
    # "waiting" placeholder (shown when no spool selected)
    - label:
        id: nfc_waiting
        width: 480
        text: "Waiting for tag..."
        text_font: roboto_28
        text_color: 0x8888AA
        text_align: CENTER
        align: CENTER

    # spool detail group
    - obj:
        id: nfc_spool_box
        x: 0
        y: 0
        width: 480
        height: 250
        styles: sty_panel
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          # ---- Spool icon — centered, 3 recolourable layers ----
          - obj:
              id: nfc_swatch
              x: 200           # (480 - 80) / 2 = 200 → horizontally centered
              y: 6
              width: 80
              height: 80
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              widgets:
                - image: {id: nfc_spool_fill, src: img_spool_fill_lg, align: CENTER, image_recolor: 0x6666AA, image_recolor_opa: COVER}
                - obj: {id: nfc_spool_hub, align: CENTER, width: 30, height: 30, radius: 15, bg_color: 0x12121A, bg_opa: COVER, border_width: 1, border_color: 0x555577, pad_all: 0, scrollbar_mode: "OFF"}
                - image: {id: nfc_spool_shine, src: img_spool_shine_lg, align: CENTER}
          # ---- Material name — large, centered ----
          - label:
              id: nfc_material
              x: 0
              y: 94
              width: 480
              height: 34
              text: ""
              text_font: roboto_28
              text_color: 0xFFFFFF
              text_align: CENTER
              long_mode: DOT
              align: TOP_LEFT
          # ---- Color name — centered below material ----
          - label:
              id: nfc_colorname
              x: 0
              y: 132
              width: 480
              height: 24
              text: ""
              text_font: roboto_20
              text_color: 0xDDDDEE
              text_align: CENTER
              long_mode: DOT
              align: TOP_LEFT
          # ---- Remaining weight — centered ----
          - label:
              id: nfc_weight
              x: 0
              y: 158
              width: 480
              height: 22
              text: ""
              text_font: roboto_16
              text_color: 0xCCCCDD
              text_align: CENTER
              align: TOP_LEFT
          # ---- Filament remaining progress bar ----
          - obj:
              id: nfc_progress_track
              x: 100
              y: 180
              width: 280
              height: 5
              bg_color: 0x2A2A45
              bg_opa: COVER
              border_width: 0
              radius: 2
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - obj:
                    id: nfc_progress_fill
                    x: 0
                    y: 0
                    width: 0
                    height: 5
                    bg_color: 0x22C55E
                    bg_opa: COVER
                    border_width: 0
                    radius: 2
                    scrollbar_mode: "OFF"
          # ---- Quick Weight button — center of single action row ----
          - button:
              id: btn_nfc_weight
              x: 164
              y: 194
              width: 152
              height: 50
              bg_color: 0x0D1E2B
              border_color: 0x2A6A82
              border_width: 1
              radius: 5
              scrollbar_mode: "OFF"
              hidden: true
              on_click:
                then:
                  - lambda: |-
                      auto s = bambuddy->snapshot();
                      auto &fi = s.current_filament;
                      // Shortcut: if scale has a stable, non-trivial weight, update directly.
                      if (s.scale_ok && s.weight_stable && s.weight_grams > 5.0f) {
                        bambuddy->record_scale_weight(fi.spool_id, s.weight_grams);
                        return;
                      }
                      // Otherwise fall through to the popup.
                      id(nfc_weight_popup_open) = 1;
                      char info[64];
                      if (!fi.material_type.empty() && !fi.color_name.empty())
                        snprintf(info, sizeof(info), "%s \xC2\xB7 %s", fi.material_type.c_str(), fi.color_name.c_str());
                      else if (!fi.material_type.empty())
                        snprintf(info, sizeof(info), "%s", fi.material_type.c_str());
                      else
                        snprintf(info, sizeof(info), "Spool #%d", fi.spool_id);
                      lv_label_set_text(id(nfc_wp_material), info);
                      if (s.scale_ok) {
                        char wbuf[16];
                        snprintf(wbuf, sizeof(wbuf), "%.0f g", s.weight_grams);
                        lv_label_set_text(id(nfc_wp_weight), wbuf);
                        lv_label_set_text(id(nfc_wp_stable),
                            s.weight_stable ? "Stable" : "");
                      } else {
                        lv_label_set_text(id(nfc_wp_weight), "---");
                        lv_label_set_text(id(nfc_wp_stable), "");
                      }
                      lv_obj_clear_flag(id(nfc_weight_popup), LV_OBJ_FLAG_HIDDEN);
              widgets:
                - label:
                    id: lbl_nfc_weight_btn
                    width: 152
                    text: "Quick Weight"
                    text_font: roboto_16
                    text_color: 0x4ECDC4
                    text_align: CENTER
                    align: CENTER
          # ---- Spool ID — small, top-right ----
          - label: {id: nfc_spoolid, x: 400, y: 94, width: 76, height: 16, text: "", text_font: roboto_12, text_color: 0x777799, text_align: RIGHT, align: TOP_LEFT}
          # TTL countdown — shown while auto-assign is pending
          - label:
              id: nfc_ttl
              x: 406
              y: 6
              width: 68
              height: 18
              text: ""
              text_font: roboto_12
              text_color: 0xFFAA44
              text_align: CENTER
              align: TOP_LEFT
              hidden: true
          # ---- Tag format icons — top-left corner, one shown at a time ----
          # Shown/hidden each tick by the interval lambda based on fi.tag_format.
          - image:
              id: nfc_icon_bambu
              src: img_icon_bambu
              x: 6
              y: 6
              align: TOP_LEFT
              hidden: true
          - image:
              id: nfc_icon_opentag3d
              src: img_icon_opentag3d
              x: 6
              y: 6
              align: TOP_LEFT
              hidden: true
          - image:
              id: nfc_icon_nfc
              src: img_icon_nfc
              x: 6
              y: 6
              align: TOP_LEFT
              hidden: true
          - button:                    # Discard — right third; expands when fewer buttons visible
              id: btn_dismiss
              x: 320
              y: 194
              width: 152
              height: 50
              bg_color: 0x2A1A28
              border_color: 0x5A2A40
              border_width: 1
              radius: 6
              scrollbar_mode: "OFF"
              on_click:
                then:
                  - lambda: bambuddy->dismiss_spool();
              widgets:
                - label:
                    text: "Discard"
                    text_font: roboto_16
                    text_color: 0xE0708C
                    align: CENTER
          - button:                    # unlink tag (left third; expands to half when weight btn hidden)
              id: btn_nfc_unlink
              x: 8
              y: 194
              width: 152
              height: 50
              bg_color: 0x2A1A1A
              border_color: 0x9C3A3A
              border_width: 2
              radius: 6
              scrollbar_mode: "OFF"
              hidden: true
              on_click:
                then:
                  - lambda: |-
                      id(confirm_action) = 1;
                      lv_label_set_text(id(confirm_msg), "Unlink this tag from its spool?");
                      lv_label_set_text(id(confirm_ok_lbl), "Unlink");
                      lv_obj_clear_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
              widgets:
                - label:
                    text: "Unlink Tag"
                    text_font: roboto_16
                    text_color: 0xFF8888
                    align: CENTER

          # Auto-assign success banner — declared after buttons so it renders on top
          - obj:
              id: nfc_assign_banner
              x: 0
              y: 194
              width: 480
              height: 50
              bg_color: 0x1A3520
              bg_opa: COVER
              border_color: 0x4CAF50
              border_width: 1
              border_opa: COVER
              radius: 6
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    id: nfc_assign_text
                    x: 0
                    y: 0
                    width: 480
                    height: 32
                    text: ""
                    text_font: roboto_16
                    text_color: 0x4CAF50
                    text_align: CENTER
                    align: LEFT_MID

          # ---- "Write NFC tag?" proposal overlay ----
          # Shown after linking a writable (non-Bambu) tag to a
          # spool. Overlays the bottom action row.
          - obj:
              id: nfc_write_banner
              x: 0
              y: 210
              width: 480
              height: 40
              bg_color: 0x0D1E30
              border_color: 0x3A6A9C
              border_width: 2
              radius: 6
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    x: 8
                    y: 0
                    width: 210
                    height: 50
                    text: "Write spool to NFC tag?"
                    text_font: roboto_12
                    text_color: 0xAABBDD
                    text_align: LEFT
                    align: TOP_LEFT
                - button:
                    id: btn_nfc_write_yes
                    x: 224
                    y: 6
                    width: 110
                    height: 38
                    bg_color: 0x0D2B14
                    border_color: 0x4CAF50
                    border_width: 2
                    radius: 4
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            bambuddy->dismiss_nfc_write_proposal();
                            // TODO: trigger NFC write action here
                    widgets:
                      - label: {text: "Write", text_font: roboto_12, text_color: 0x4CAF50, align: CENTER}
                - button:
                    id: btn_nfc_write_skip
                    x: 344
                    y: 6
                    width: 110
                    height: 38
                    bg_color: 0x1E2030
                    border_color: 0x6666AA
                    border_width: 1
                    radius: 4
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: bambuddy->dismiss_nfc_write_proposal();
                    widgets:
                      - label: {text: "Skip", text_font: roboto_12, text_color: 0xBBBBCC, align: CENTER}

          # ---- Quick Weight popup — full overlay, shown over spool detail ----
          - obj:
              id: nfc_weight_popup
              x: 0
              y: 0
              width: 480
              height: 250
              bg_color: 0x0A0A1A
              bg_opa: COVER
              border_color: 0x2A6A82
              border_width: 2
              radius: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    x: 0
                    y: 16
                    width: 480
                    height: 26
                    text: "Update Spool Weight"
                    text_font: roboto_20
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    align: TOP_LEFT
                - label:
                    id: nfc_wp_material
                    x: 0
                    y: 50
                    width: 480
                    height: 20
                    text: ""
                    text_font: roboto_16
                    text_color: 0xCCCCDD
                    text_align: CENTER
                    long_mode: DOT
                    align: TOP_LEFT
                - label:
                    x: 0
                    y: 76
                    width: 480
                    height: 16
                    text: "Current scale reading:"
                    text_font: roboto_12
                    text_color: 0x6666AA
                    text_align: CENTER
                    align: TOP_LEFT
                - label:
                    id: nfc_wp_weight
                    x: 0
                    y: 94
                    width: 480
                    height: 52
                    text: "---"
                    text_font: roboto_40
                    text_color: 0x4ECDC4
                    text_align: CENTER
                    align: TOP_LEFT
                - label:
                    id: nfc_wp_stable
                    x: 0
                    y: 150
                    width: 480
                    height: 16
                    text: ""
                    text_font: roboto_12
                    text_color: 0x5A8A7A
                    text_align: CENTER
                    align: TOP_LEFT
                - button:
                    id: btn_nfc_wp_update
                    x: 8
                    y: 174
                    width: 220
                    height: 34
                    bg_color: 0x0D2B14
                    border_color: 0x4CAF50
                    border_width: 2
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            auto s = bambuddy->snapshot();
                            int spool_id = s.current_filament.spool_id;
                            float w = s.weight_grams;
                            if (spool_id > 0 && s.scale_ok) {
                              bambuddy->record_scale_weight(spool_id, w);
                            }
                            id(nfc_weight_popup_open) = 0;
                            lv_obj_add_flag(id(nfc_weight_popup), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label: {text: "Update", text_font: roboto_16, text_color: 0x4CAF50, align: CENTER}
                - button:
                    id: btn_nfc_wp_cancel
                    x: 244
                    y: 174
                    width: 228
                    height: 34
                    bg_color: 0x1E2040
                    border_color: 0x8585B8
                    border_width: 1
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            id(nfc_weight_popup_open) = 0;
                            lv_obj_add_flag(id(nfc_weight_popup), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label: {text: "Cancel", text_font: roboto_16, text_color: 0xBBBBCC, align: CENTER}

          # ---- Archive proposal popup — shown after Quick Weight records 0g remaining ----
          - obj:
              id: nfc_archive_proposal_popup
              x: 0
              y: 0
              width: 480
              height: 250
              bg_color: 0x0A0A1A
              bg_opa: COVER
              border_color: 0x6A3A28
              border_width: 2
              radius: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    x: 0
                    y: 20
                    width: 480
                    height: 26
                    text: "\U000F003C"
                    text_font: mdi_30
                    text_color: 0xE0A060
                    text_align: CENTER
                    align: TOP_LEFT
                - label:
                    x: 0
                    y: 58
                    width: 480
                    height: 26
                    text: "Spool Empty"
                    text_font: roboto_20
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    align: TOP_LEFT
                - label:
                    id: nfc_archive_prop_info
                    x: 0
                    y: 88
                    width: 480
                    height: 20
                    text: ""
                    text_font: roboto_16
                    text_color: 0xCCCCDD
                    text_align: CENTER
                    long_mode: DOT
                    align: TOP_LEFT
                - label:
                    x: 0
                    y: 114
                    width: 480
                    height: 16
                    text: "Archive this spool?"
                    text_font: roboto_12
                    text_color: 0x6666AA
                    text_align: CENTER
                    align: TOP_LEFT
                - button:
                    x: 8
                    y: 176
                    width: 220
                    height: 40
                    bg_color: 0x0D2B14
                    border_color: 0x4CAF50
                    border_width: 2
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            auto s = bambuddy->snapshot();
                            int sid = s.current_filament.spool_id;
                            lv_obj_add_flag(id(nfc_archive_proposal_popup), LV_OBJ_FLAG_HIDDEN);
                            if (sid > 0) bambuddy->archive_spool(sid);
                    widgets:
                      - label: {text: "Archive", text_font: roboto_16, text_color: 0x4CAF50, align: CENTER}
                - button:
                    x: 244
                    y: 176
                    width: 228
                    height: 40
                    bg_color: 0x1E2040
                    border_color: 0x8585B8
                    border_width: 1
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            lv_obj_add_flag(id(nfc_archive_proposal_popup), LV_OBJ_FLAG_HIDDEN);
                            bambuddy->dismiss_archive_proposal();
                    widgets:
                      - label: {text: "Keep", text_font: roboto_16, text_color: 0xBBBBCC, align: CENTER}

    # ================ NFC: UNLINKED TAG PANEL ================
    # Shown when a tag is present on the reader but not yet
    # linked to any spool in inventory.
    - obj:
        id: nfc_unlinked_panel
        x: 0
        y: 0
        width: 480
        height: 250
        styles: sty_panel
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          - label:
              x: 0
              y: 20
              width: 480
              text: "\U000F0396"
              text_font: mdi_30
              text_color: 0x8585B8
              text_align: CENTER
              align: TOP_LEFT
          - label:
              id: nfc_unlinked_uid
              x: 0
              y: 56
              width: 480
              height: 16
              text: ""
              text_font: roboto_12
              text_color: 0x9898C0
              text_align: CENTER
              align: TOP_LEFT
          - label:
              x: 0
              y: 80
              width: 480
              height: 26
              text: "Tag not linked to any spool"
              text_font: roboto_20
              text_color: 0xBBBBCC
              text_align: CENTER
              align: TOP_LEFT
          - label:
              id: nfc_unlinked_ttl
              x: 0
              y: 108
              width: 480
              height: 18
              text: ""
              text_font: roboto_12
              text_color: 0x6666AA
              text_align: CENTER
              align: TOP_LEFT
          # Action buttons
          - button:
              id: btn_add_to_inventory
              x: 8
              y: 196
              width: 148
              height: 44
              bg_color: 0x0D2B14
              border_color: 0x4CAF50
              border_width: 2
              radius: 6
              scrollbar_mode: "OFF"
              on_click:
                then:
                  - lambda: bambuddy->create_spool_from_tag();
              widgets:
                - label: {text: "Add to Inventory", text_font: roboto_12, text_color: 0x4CAF50, align: CENTER}
          - button:
              id: btn_assign_spool
              x: 164
              y: 196
              width: 148
              height: 44
              bg_color: 0x0D2B14
              border_color: 0x4CAF50
              border_width: 2
              radius: 6
              scrollbar_mode: "OFF"
              on_click:
                then:
                  - lambda: |-
                      bambuddy->request_recent_spools();
                      // Reset the manual ID entry to #1 each time the picker opens.
                      id(nfc_assign_spool_id) = 1;
                      lv_label_set_text(id(lbl_picker_id), "ID: 1");
                      lv_label_set_text(id(lbl_picker_assign_id), "Assign #1");
                      // Clear the stale grid right away so the previous spools don't
                      // flash before the refetch populates (the UI tick is up to 400ms).
                      lv_obj_t *pbtns[9] = {id(picker_btn_0), id(picker_btn_1), id(picker_btn_2),
                                            id(picker_btn_3), id(picker_btn_4), id(picker_btn_5),
                                            id(picker_btn_6), id(picker_btn_7), id(picker_btn_8)};
                      for (auto *b : pbtns) lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
                      lv_label_set_text(id(nfc_picker_loading), "Loading...");
                      lv_obj_clear_flag(id(nfc_picker_loading), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(nfc_unlinked_panel), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(id(nfc_picker_panel), LV_OBJ_FLAG_HIDDEN);
              widgets:
                - label: {text: "Assign Spool", text_font: roboto_12, text_color: 0x4CAF50, align: CENTER}
          - button:
              id: btn_nfc_discard_unlinked
              x: 320
              y: 196
              width: 152
              height: 44
              bg_color: 0x2A1A28
              border_color: 0x5A2A40
              border_width: 1
              radius: 6
              scrollbar_mode: "OFF"
              on_click:
                then:
                  - lambda: |-
                      id(nfc_unlinked_dismissed) = 1;
                      lv_obj_add_flag(id(nfc_unlinked_panel), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(id(nfc_waiting), LV_OBJ_FLAG_HIDDEN);
              widgets:
                - label: {text: "Discard", text_font: roboto_16, text_color: 0xE0708C, align: CENTER}

    # ================ NFC: SPOOL PICKER PANEL ================
    # 3×3 grid of 9 most-recently-added spools for quick linking,
    # plus an ID input row for manual spool ID entry.
    - obj:
        id: nfc_picker_panel
        x: 0
        y: 0
        width: 480
        height: 250
        styles: sty_panel
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          # ---- Header ----
          - label:
              x: 4
              y: 4
              width: 320
              height: 20
              text: "Select spool to link"
              text_font: roboto_12
              text_color: 0xBBBBCC
              align: TOP_LEFT
          - button:
              id: btn_picker_cancel
              x: 394
              y: 2
              width: 82
              height: 24
              bg_color: 0x2A1A1A
              border_color: 0xCC3333
              border_width: 1
              radius: 4
              scrollbar_mode: "OFF"
              on_click:
                then:
                  - lambda: |-
                      lv_obj_add_flag(id(nfc_picker_panel), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_clear_flag(id(nfc_unlinked_panel), LV_OBJ_FLAG_HIDDEN);
              widgets:
                - label: {text: "Cancel", text_font: roboto_12, text_color: 0xFF8888, align: CENTER}
          # ---- Loading indicator ----
          - label:
              id: nfc_picker_loading
              x: 0
              y: 100
              width: 480
              height: 20
              text: "Loading..."
              text_font: roboto_16
              text_color: 0x8888AA
              text_align: CENTER
              align: TOP_LEFT
          # ---- 3×3 spool grid (rows at y=28/84/140, cols at x=2/162/322) ----
          # Slot 0
          - obj:
              id: picker_btn_0
              x: 2
              y: 28
              width: 154
              height: 52
              bg_color: 0x1E1E30
              border_color: 0x3A3A56
              border_width: 1
              radius: 4
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              on_click:
                then:
                  - lambda: |-
                      intptr_t d=(intptr_t)lv_obj_get_user_data(id(picker_btn_0));
                      if(d>0){bambuddy->link_tag_to_spool((int)d);lv_obj_add_flag(id(nfc_picker_panel),LV_OBJ_FLAG_HIDDEN);}
              widgets:
                # Spool icon — images wrapped in an obj (not directly in the
                # button) so the overlapping hub layer renders, same as the hero.
                - obj:
                    x: 6
                    y: 10
                    width: 32
                    height: 32
                    bg_opa: TRANSP
                    border_width: 0
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    widgets:
                      - image: {id: picker_fill_0, src: img_spool_fill, align: CENTER, image_recolor: 0x6666AA, image_recolor_opa: COVER}
                      - obj: {id: picker_hub_0, align: CENTER, width: 12, height: 12, radius: 6, bg_color: 0x1E1E30, bg_opa: COVER, border_width: 1, border_color: 0x555577, pad_all: 0, scrollbar_mode: "OFF"}
                - label: {id: picker_mat_0, x: 44, y: 3, width: 106, height: 16, text: "", text_font: roboto_12, text_color: 0xDDDDEE, align: TOP_LEFT}
                - label: {id: picker_brand_0, x: 44, y: 19, width: 106, height: 16, text: "", text_font: roboto_12, text_color: 0xBBBBCC, align: TOP_LEFT}
                - label: {id: picker_id_0, x: 44, y: 35, width: 106, height: 14, text: "", text_font: roboto_12, text_color: 0x777799, align: TOP_LEFT}
          # Slot 1
          - obj:
              id: picker_btn_1
              x: 162
              y: 28
              width: 154
              height: 52
              bg_color: 0x1E1E30
              border_color: 0x3A3A56
              border_width: 1
              radius: 4
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              on_click:
                then:
                  - lambda: |-
