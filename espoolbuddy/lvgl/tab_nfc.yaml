obj:
  id: content_nfc
  width: 100%
  height: 100%
  styles: sty_panel
  scrollbar_mode: "OFF"
  hidden: true
  widgets:
    # "waiting" placeholder (shown when no spool selected)
    - label:
        id: nfc_waiting
        width: 100%
        text: "Waiting for tag..."
        text_font: roboto_28
        text_color: 0x8888AA
        text_align: CENTER
        align: CENTER

    # spool detail group
    - obj:
        id: nfc_spool_box
        width: 100%
        height: 100%
        styles: sty_panel
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          # ---- Hero content group — icon/material/color/weight/progress,
          # centered as a block in the panel regardless of screen size (no
          # per-device pixel offsets; the corner-anchored siblings below —
          # spool ID, TTL, tag-format icons, action row — stay absolute). ----
          - obj:
              id: nfc_hero_group
              align: CENTER
              # Shifted up from dead-center: on the 320px-tall console, centering
              # in the full panel height overlaps the bottom action row/assign
              # banner (both anchored BOTTOM_MID, ~56px reserved). The hero
              # content's own height is fixed (icon+labels+bar, independent of
              # screen size), so a constant offset reliably clears that reserved
              # band on the small screen while only nudging it up slightly on
              # the larger pandatouch panel, where there was already headroom.
              y: -32
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              layout:
                type: flex
                flex_flow: column
                flex_align_cross: center
                pad_row: 4
              widgets:
                # ---- Spool icon — 3 recolourable layers ----
                - obj:
                    id: nfc_swatch
                    width: 80
                    height: 80
                    bg_opa: TRANSP
                    border_width: 0
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    widgets:
                      - image: {id: nfc_spool_fill, src: img_spool_fill_lg, align: CENTER, image_recolor: 0x6666AA, image_recolor_opa: COVER}
                      - obj: {id: nfc_spool_hub, align: CENTER, width: 30, height: 30, radius: 15, bg_color: 0x12121A, bg_opa: COVER, border_width: 1, border_color: 0x555577, pad_all: 0, scrollbar_mode: "OFF"}
                      - image: {id: nfc_spool_shine, src: img_spool_shine_lg, align: CENTER}
                # ---- Material name — large ----
                - label:
                    id: nfc_material
                    width: 100%
                    height: 34
                    text: ""
                    text_font: roboto_28
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    long_mode: DOT
                # ---- Color name — below material ----
                - label:
                    id: nfc_colorname
                    width: 100%
                    height: 24
                    text: ""
                    text_font: roboto_20
                    text_color: 0xDDDDEE
                    text_align: CENTER
                    long_mode: DOT
                # ---- Remaining weight ----
                - label:
                    id: nfc_weight
                    width: 100%
                    height: 22
                    text: ""
                    text_font: roboto_16
                    text_color: 0xCCCCDD
                    text_align: CENTER
                # ---- Filament remaining progress bar ----
                - obj:
                    id: nfc_progress_track
                    width: 70%
                    height: 5
                    bg_color: 0x2A2A45
                    bg_opa: COVER
                    border_width: 0
                    radius: 2
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    hidden: true
                    widgets:
                      - obj:
                          id: nfc_progress_fill
                          x: 0
                          y: 0
                          width: 0
                          height: 5
                          bg_color: 0x22C55E
                          bg_opa: COVER
                          border_width: 0
                          radius: 2
                          scrollbar_mode: "OFF"
          # ---- Spool ID — small, top-right ----
          - label: {id: nfc_spoolid, x: 400, y: 94, width: 76, height: 16, text: "", text_font: roboto_12, text_color: 0x777799, text_align: RIGHT, align: TOP_LEFT}
          # TTL countdown — shown while auto-assign is pending
          - label:
              id: nfc_ttl
              x: 406
              y: 6
              width: 68
              height: 18
              text: ""
              text_font: roboto_12
              text_color: 0xFFAA44
              text_align: CENTER
              align: TOP_LEFT
              hidden: true
          # ---- Tag format icons — top-left corner, one shown at a time ----
          # Shown/hidden each tick by the interval lambda based on fi.tag_format.
          - image:
              id: nfc_icon_bambu
              src: img_icon_bambu
              x: 6
              y: 6
              align: TOP_LEFT
              hidden: true
          - image:
              id: nfc_icon_opentag3d
              src: img_icon_opentag3d
              x: 6
              y: 6
              align: TOP_LEFT
              hidden: true
          - image:
              id: nfc_icon_nfc
              src: img_icon_nfc
              x: 6
              y: 6
              align: TOP_LEFT
              hidden: true

          # ---- Action row: Unlink | Quick Weight | Discard ----
          # Flex row, bottom of the panel. Buttons stretch to share the
          # available width equally (flex_grow: 1); which are visible is
          # decided at runtime (LV_OBJ_FLAG_HIDDEN) by app.yaml —
          # flex automatically reflows the remaining visible buttons.
          - obj:
              id: nfc_action_row
              align: BOTTOM_MID
              y: -6
              width: 100%
              height: 50
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              pad_left: 8
              pad_right: 8
              layout:
                type: FLEX
                flex_flow: ROW
                pad_column: 8
              scrollbar_mode: "OFF"
              widgets:
                # ---- Unlink tag ----
                - button:
                    id: btn_nfc_unlink
                    flex_grow: 1
                    height: 50
                    bg_color: 0x2A1A1A
                    border_color: 0x9C3A3A
                    border_width: 2
                    radius: 6
                    scrollbar_mode: "OFF"
                    hidden: true
                    on_click:
                      then:
                        - lambda: |-
                            id(confirm_action) = 1;
                            lv_label_set_text(id(confirm_msg), "Unlink this tag from its spool?");
                            lv_label_set_text(id(confirm_ok_lbl), "Unlink");
                            lv_obj_clear_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label:
                          text: "Unlink Tag"
                          text_font: roboto_16
                          text_color: 0xFF8888
                          align: CENTER
                # ---- Quick Weight ----
                - button:
                    id: btn_nfc_weight
                    flex_grow: 1
                    height: 50
                    bg_color: 0x0D1E2B
                    border_color: 0x2A6A82
                    border_width: 1
                    radius: 5
                    scrollbar_mode: "OFF"
                    hidden: true
                    on_click:
                      then:
                        - lambda: |-
                            auto s = bambuddy->snapshot();
                            auto &fi = s.current_filament;
                            // Shortcut: if scale has a stable, non-trivial weight, update directly.
                            if (s.scale_ok && s.weight_stable && s.weight_grams > 5.0f) {
                              bambuddy->record_scale_weight(fi.spool_id, s.weight_grams);
                              return;
                            }
                            // Otherwise fall through to the popup.
                            id(nfc_weight_popup_open) = 1;
                            char info[64];
                            if (!fi.material_type.empty() && !fi.color_name.empty())
                              snprintf(info, sizeof(info), "%s \xC2\xB7 %s", fi.material_type.c_str(), fi.color_name.c_str());
                            else if (!fi.material_type.empty())
                              snprintf(info, sizeof(info), "%s", fi.material_type.c_str());
                            else
                              snprintf(info, sizeof(info), "Spool #%d", fi.spool_id);
                            lv_label_set_text(id(nfc_wp_material), info);
                            if (s.scale_ok) {
                              char wbuf[16];
                              snprintf(wbuf, sizeof(wbuf), "%.0f g", s.weight_grams);
                              lv_label_set_text(id(nfc_wp_weight), wbuf);
                              lv_label_set_text(id(nfc_wp_stable),
                                  s.weight_stable ? "Stable" : "");
                            } else {
                              lv_label_set_text(id(nfc_wp_weight), "---");
                              lv_label_set_text(id(nfc_wp_stable), "");
                            }
                            lv_obj_clear_flag(id(nfc_weight_popup), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label:
                          id: lbl_nfc_weight_btn
                          width: 100%
                          text: "Quick Weight"
                          text_font: roboto_16
                          text_color: 0x4ECDC4
                          text_align: CENTER
                          align: CENTER
                # ---- Discard ----
                - button:
                    id: btn_dismiss
                    flex_grow: 1
                    height: 50
                    bg_color: 0x2A1A28
                    border_color: 0x5A2A40
                    border_width: 1
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: bambuddy->dismiss_spool();
                    widgets:
                      - label:
                          text: "Discard"
                          text_font: roboto_16
                          text_color: 0xE0708C
                          align: CENTER

          # Auto-assign success banner — declared after buttons so it renders on top
          - obj:
              id: nfc_assign_banner
              align: BOTTOM_MID
              y: -6
              width: 100%
              height: 50
              bg_color: 0x1A3520
              bg_opa: COVER
              border_color: 0x4CAF50
              border_width: 1
              border_opa: COVER
              radius: 6
              pad_all: 0
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    id: nfc_assign_text
                    x: 0
                    y: 0
                    width: 100%
                    height: 32
                    text: ""
                    text_font: roboto_16
                    text_color: 0x4CAF50
                    text_align: CENTER
                    align: LEFT_MID

          # ---- "Write NFC tag?" proposal overlay ----
          # Shown after linking a writable (non-Bambu) tag to a
          # spool. Overlays the bottom action row.
          - obj:
              id: nfc_write_banner
              align: BOTTOM_MID
              y: -6
              width: 100%
              height: 40
              bg_color: 0x0D1E30
              border_color: 0x3A6A9C
              border_width: 2
              radius: 6
              pad_all: 0
              pad_left: 8
              pad_right: 8
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_cross: center
                pad_column: 6
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    flex_grow: 1
                    text: "Write spool to NFC tag?"
                    text_font: roboto_12
                    text_color: 0xAABBDD
                    text_align: LEFT
                - button:
                    id: btn_nfc_write_yes
                    width: 100
                    height: 38
                    bg_color: 0x0D2B14
                    border_color: 0x4CAF50
                    border_width: 2
                    radius: 4
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            bambuddy->dismiss_nfc_write_proposal();
                            // TODO: trigger NFC write action here
                    widgets:
                      - label: {text: "Write", text_font: roboto_12, text_color: 0x4CAF50, align: CENTER}
                - button:
                    id: btn_nfc_write_skip
                    width: 100
                    height: 38
                    bg_color: 0x1E2030
                    border_color: 0x6666AA
                    border_width: 1
                    radius: 4
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: bambuddy->dismiss_nfc_write_proposal();
                    widgets:
                      - label: {text: "Skip", text_font: roboto_12, text_color: 0xBBBBCC, align: CENTER}

          # ---- Quick Weight popup — sized to content, shown over spool detail ----
          - obj:
              id: nfc_weight_popup
              align: CENTER
              width: 90%
              height: SIZE_CONTENT
              bg_color: 0x0A0A1A
              bg_opa: COVER
              border_color: 0x2A6A82
              border_width: 2
              radius: 0
              pad_all: 0
              pad_top: 16
              pad_bottom: 8
              layout:
                type: FLEX
                flex_flow: COLUMN
                pad_row: 8
              scrollbar_mode: "OFF"
              scrollable: false
              hidden: true
              widgets:
                - label:
                    width: 100%
                    height: 26
                    text: "Update Spool Weight"
                    text_font: roboto_20
                    text_color: 0xFFFFFF
                    text_align: CENTER
                - label:
                    id: nfc_wp_material
                    width: 100%
                    height: 20
                    text: ""
                    text_font: roboto_16
                    text_color: 0xCCCCDD
                    text_align: CENTER
                    long_mode: DOT
                - label:
                    width: 100%
                    height: 16
                    text: "Current scale reading:"
                    text_font: roboto_12
                    text_color: 0x6666AA
                    text_align: CENTER
                - label:
                    id: nfc_wp_weight
                    width: 100%
                    height: 52
                    text: "---"
                    text_font: roboto_40
                    text_color: 0x4ECDC4
                    text_align: CENTER
                - label:
                    id: nfc_wp_stable
                    width: 100%
                    height: 16
                    text: ""
                    text_font: roboto_12
                    text_color: 0x5A8A7A
                    text_align: CENTER
                - obj:
                    width: 100%
                    height: 34
                    bg_opa: TRANSP
                    border_width: 0
                    pad_all: 0
                    pad_left: 8
                    pad_right: 8
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      pad_column: 8
                    scrollbar_mode: "OFF"
                    widgets:
                      - button:
                          id: btn_nfc_wp_update
                          flex_grow: 1
                          height: 34
                          bg_color: 0x0D2B14
                          border_color: 0x4CAF50
                          border_width: 2
                          radius: 6
                          scrollbar_mode: "OFF"
                          on_click:
                            then:
                              - lambda: |-
                                  auto s = bambuddy->snapshot();
                                  int spool_id = s.current_filament.spool_id;
                                  float w = s.weight_grams;
                                  if (spool_id > 0 && s.scale_ok) {
                                    bambuddy->record_scale_weight(spool_id, w);
                                  }
                                  id(nfc_weight_popup_open) = 0;
                                  lv_obj_add_flag(id(nfc_weight_popup), LV_OBJ_FLAG_HIDDEN);
                          widgets:
                            - label: {text: "Update", text_font: roboto_16, text_color: 0x4CAF50, align: CENTER}
                      - button:
                          id: btn_nfc_wp_cancel
                          flex_grow: 1
                          height: 34
                          bg_color: 0x1E2040
                          border_color: 0x8585B8
                          border_width: 1
                          radius: 6
                          scrollbar_mode: "OFF"
                          on_click:
                            then:
                              - lambda: |-
                                  id(nfc_weight_popup_open) = 0;
                                  lv_obj_add_flag(id(nfc_weight_popup), LV_OBJ_FLAG_HIDDEN);
                          widgets:
                            - label: {text: "Cancel", text_font: roboto_16, text_color: 0xBBBBCC, align: CENTER}

          # ---- Archive proposal popup — shown after Quick Weight records 0g remaining ----
          - obj:
              id: nfc_archive_proposal_popup
              align: CENTER
              width: 90%
              height: 100%
              bg_color: 0x0A0A1A
              bg_opa: COVER
              border_color: 0x6A3A28
              border_width: 2
              radius: 0
              pad_all: 0
              pad_top: 16
              pad_bottom: 8
              layout:
                type: FLEX
                flex_flow: COLUMN
                pad_row: 8
              scrollbar_mode: "OFF"
              hidden: true
              widgets:
                - label:
                    width: 100%
                    height: 26
                    text: "\U000F003C"
                    text_font: mdi_30
                    text_color: 0xE0A060
                    text_align: CENTER
                - label:
                    width: 100%
                    height: 26
                    text: "Spool Empty"
                    text_font: roboto_20
                    text_color: 0xFFFFFF
                    text_align: CENTER
                - label:
                    id: nfc_archive_prop_info
                    width: 100%
                    height: 20
                    text: ""
                    text_font: roboto_16
                    text_color: 0xCCCCDD
                    text_align: CENTER
                    long_mode: DOT
                - label:
                    width: 100%
                    height: 16
                    text: "Archive this spool?"
                    text_font: roboto_12
                    text_color: 0x6666AA
                    text_align: CENTER
                - obj:
                    width: 100%
                    height: 40
                    bg_opa: TRANSP
                    border_width: 0
                    pad_all: 0
                    pad_left: 8
                    pad_right: 8
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      pad_column: 8
                    scrollbar_mode: "OFF"
                    widgets:
                      - button:
                          flex_grow: 1
                          height: 40
                          bg_color: 0x0D2B14
                          border_color: 0x4CAF50
                          border_width: 2
                          radius: 6
                          scrollbar_mode: "OFF"
                          on_click:
                            then:
                              - lambda: |-
                                  auto s = bambuddy->snapshot();
                                  int sid = s.current_filament.spool_id;
                                  lv_obj_add_flag(id(nfc_archive_proposal_popup), LV_OBJ_FLAG_HIDDEN);
                                  if (sid > 0) bambuddy->archive_spool(sid);
                          widgets:
                            - label: {text: "Archive", text_font: roboto_16, text_color: 0x4CAF50, align: CENTER}
                      - button:
                          flex_grow: 1
                          height: 40
                          bg_color: 0x1E2040
                          border_color: 0x8585B8
                          border_width: 1
                          radius: 6
                          scrollbar_mode: "OFF"
                          on_click:
                            then:
                              - lambda: |-
                                  lv_obj_add_flag(id(nfc_archive_proposal_popup), LV_OBJ_FLAG_HIDDEN);
                                  bambuddy->dismiss_archive_proposal();
                          widgets:
                            - label: {text: "Keep", text_font: roboto_16, text_color: 0xBBBBCC, align: CENTER}

    # ================ NFC: UNLINKED TAG PANEL ================
    # Shown when a tag is present on the reader but not yet
    # linked to any spool in inventory.
    - obj:
        id: nfc_unlinked_panel
        width: 100%
        height: 100%
        styles: sty_panel
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          # ---- Hero content group — icon/UID/title/TTL, centered as a block
          # regardless of screen size (no per-device pixel offsets; the
          # bottom action row stays absolute). ----
          - obj:
              id: nfc_unlinked_hero_group
              align: CENTER
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              layout:
                type: flex
                flex_flow: column
                flex_align_cross: center
                pad_row: 4
              widgets:
                - label:
                    width: 100%
                    text: "\U000F0396"
                    text_font: mdi_30
                    text_color: 0x8585B8
                    text_align: CENTER
                - label:
                    id: nfc_unlinked_uid
                    width: 100%
                    height: 16
                    text: ""
                    text_font: roboto_12
                    text_color: 0x9898C0
                    text_align: CENTER
                - label:
                    width: 100%
                    height: 26
                    text: "Tag not linked to any spool"
                    text_font: roboto_20
                    text_color: 0xBBBBCC
                    text_align: CENTER
                - label:
                    id: nfc_unlinked_ttl
                    width: 100%
                    height: 18
                    text: ""
                    text_font: roboto_12
                    text_color: 0x6666AA
                    text_align: CENTER
          # Action buttons
          - obj:
              align: BOTTOM_MID
              y: -6
              width: 100%
              height: 44
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              pad_left: 8
              pad_right: 8
              layout:
                type: FLEX
                flex_flow: ROW
                pad_column: 4
              scrollbar_mode: "OFF"
              widgets:
                - button:
                    id: btn_add_to_inventory
                    flex_grow: 1
                    height: 44
                    bg_color: 0x0D2B14
                    border_color: 0x4CAF50
                    border_width: 2
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: bambuddy->create_spool_from_tag();
                    widgets:
                      - label: {text: "Add to Inventory", text_font: roboto_12, text_color: 0x4CAF50, align: CENTER}
                - button:
                    id: btn_assign_spool
                    flex_grow: 1
                    height: 44
                    bg_color: 0x0D2B14
                    border_color: 0x4CAF50
                    border_width: 2
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            bambuddy->request_recent_spools();
                            // Reset the manual ID entry to #1 each time the picker opens.
                            id(nfc_assign_spool_id) = 1;
                            lv_label_set_text(id(lbl_picker_id), "ID: 1");
                            lv_label_set_text(id(lbl_picker_assign_id), "Assign #1");
                            // Clear the stale grid right away so the previous spools don't
                            // flash before the refetch populates (the UI tick is up to 400ms).
                            lv_obj_t *pbtns[9] = {id(picker_btn_0), id(picker_btn_1), id(picker_btn_2),
                                                  id(picker_btn_3), id(picker_btn_4), id(picker_btn_5),
                                                  id(picker_btn_6), id(picker_btn_7), id(picker_btn_8)};
                            for (auto *b : pbtns) lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
                            lv_label_set_text(id(nfc_picker_loading), "Loading...");
                            lv_obj_clear_flag(id(nfc_picker_loading), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_add_flag(id(nfc_unlinked_panel), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(nfc_picker_panel), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label: {text: "Assign Spool", text_font: roboto_12, text_color: 0x4CAF50, align: CENTER}
                - button:
                    id: btn_nfc_discard_unlinked
                    flex_grow: 1
                    height: 44
                    bg_color: 0x2A1A28
                    border_color: 0x5A2A40
                    border_width: 1
                    radius: 6
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            id(nfc_unlinked_dismissed) = 1;
                            lv_obj_add_flag(id(nfc_unlinked_panel), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(nfc_waiting), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label: {text: "Discard", text_font: roboto_16, text_color: 0xE0708C, align: CENTER}

    # ================ NFC: SPOOL PICKER PANEL ================
    # 3×3 grid of 9 most-recently-added spools for quick linking,
    # plus an ID input row for manual spool ID entry.
    - obj:
        id: nfc_picker_panel
        width: 100%
        height: 100%
        styles: sty_panel
        scrollbar_mode: "OFF"
        scrollable: false
        hidden: true
        layout:
          type: flex
          flex_flow: column
        widgets:
          # ---- Header ----
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 24
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              pad_left: 4
              pad_right: 4
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_cross: center
                pad_column: 8
              scrollbar_mode: "OFF"
              widgets:
                - label:
                    flex_grow: 1
                    text: "Select spool to link"
                    text_font: roboto_12
                    text_color: 0xBBBBCC
                - button:
                    id: btn_picker_cancel
                    width: 82
                    height: 24
                    bg_color: 0x2A1A1A
                    border_color: 0xCC3333
                    border_width: 1
                    radius: 4
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            lv_obj_add_flag(id(nfc_picker_panel), LV_OBJ_FLAG_HIDDEN);
                            lv_obj_clear_flag(id(nfc_unlinked_panel), LV_OBJ_FLAG_HIDDEN);
                    widgets:
                      - label: {text: "Cancel", text_font: roboto_12, text_color: 0xFF8888, align: CENTER}
