          # ---- Manual ID input row ----
          # Layout: [-10] [-] [ID label, flex_grow] [+] [+10] [Assign]
          # Flex row; the stepper buttons and Assign keep fixed
          # content-sized widths, the ID label absorbs remaining space.
          - obj:
              width: 100%
              height: 44
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              pad_left: 2
              pad_right: 2
              layout:
                type: FLEX
                flex_flow: ROW
                pad_column: 4
              scrollbar_mode: "OFF"
              widgets:
                - button:
                    id: btn_id_minus10
                    width: 50
                    height: 44
                    bg_color: 0x1E1E30
                    border_color: 0x3A3A56
                    border_width: 1
                    radius: 4
                    scrollbar_mode: "OFF"
                    on_click:
                      then:
                        - lambda: |-
                            int v=(int)id(nfc_assign_spool_id)-10; if(v<1)v=1;
                            id(nfc_assign_spool_id)=v;
                            char b[16]; snprintf(b,sizeof(b),"ID: %d",v);
                            lv_label_set_text(id(lbl_picker_id),b);
                            char a[24]; snprintf(a,sizeof(a),"Assign #%d",v);
                            lv_label_set_text(id(lbl_picker_assign_id),a);
                    widgets:
                      - label: {text: "-10", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                - button:
                    id: btn_id_minus
                    width: 40
                    height: 44
                    bg_color: 0x1E1E30
                    border_color: 0x3A3A56
                    border_width: 1
                    radius: 4
                    scrollbar_mode: "OFF"
