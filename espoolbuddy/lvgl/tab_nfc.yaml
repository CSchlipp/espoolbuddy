                      then:
                        - lambda: |-
                            if((int)id(nfc_assign_spool_id)>1) id(nfc_assign_spool_id)--;
                            int v=(int)id(nfc_assign_spool_id);
                            char b[16]; snprintf(b,sizeof(b),"ID: %d",v);
                            lv_label_set_text(id(lbl_picker_id),b);
                            char a[24]; snprintf(a,sizeof(a),"Assign #%d",v);
                            lv_label_set_text(id(lbl_picker_assign_id),a);
                    widgets:
                      - label: {text: "-", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                - label:
                    id: lbl_picker_id
                    flex_grow: 1
                    height: 44
                    text: "ID: 1"
                    text_font: roboto_16
                    text_color: 0xFFFFFF
                    text_align: CENTER
                    align: CENTER
                - button:
                    id: btn_id_plus
                    width: 40
                    height: 44
                    bg_color: 0x1E1E30
                    border_color: 0x3A3A56
                    border_width: 1
                    radius: 4
                    scrollbar_mode: "OFF"
