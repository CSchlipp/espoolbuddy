    # ---- AMS pagination nav bar (y=220, h=26) ----------------
    - button:
        id: ams_pg_prev
        x: 4
        y: 220
        width: 68
        height: 26
        styles: sty_accent_btn
        scrollbar_mode: "OFF"
        hidden: true
        on_click:
          then:
            - lambda: "if (id(ams_page) > 0) id(ams_page)--;"
        widgets:
          - label: {x: 0, y: 0, width: 68, height: 26, text: "\U000F0141", text_font: mdi_24, text_color: 0x7BB4FF, align: CENTER}
    - label:
        id: ams_pg_label
        x: 0
        y: 220
        width: 480
        height: 26
        text: ""
        text_font: roboto_12
        text_color: 0xCCCCDD
        text_align: CENTER
        align: TOP_LEFT
        hidden: true
    - button:
        id: ams_pg_next
        x: 408
        y: 220
        width: 68
        height: 26
        styles: sty_accent_btn
        scrollbar_mode: "OFF"
        hidden: true
        on_click:
          then:
            - lambda: "id(ams_page)++;"
        widgets:
          - label: {x: 0, y: 0, width: 68, height: 26, text: "\U000F0142", text_font: mdi_24, text_color: 0x7BB4FF, align: CENTER}
    # ---- AMS removed spool toast — green info banner, shown for 5 s ----
    - obj:
        id: ams_removed_toast
        x: 20
        y: 208
        width: 440
        height: 34
        bg_color: 0x0D2A14
        bg_opa: COVER
        border_color: 0x22C55E
        border_width: 1
        radius: 6
        pad_all: 0
        scrollbar_mode: "OFF"
        hidden: true
        widgets:
          - label:
              id: ams_removed_toast_lbl
              width: 440
              height: 34
              text: ""
              text_font: roboto_12
              text_color: 0x4CAF50
              text_align: CENTER
              long_mode: DOT
              align: CENTER

