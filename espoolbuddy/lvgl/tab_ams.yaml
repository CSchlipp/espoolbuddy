obj:
  id: content_ams
  x: 0
  y: 30
  width: 480
  height: 250
  styles: sty_panel
  scrollbar_mode: "OFF"
  widgets:
    - label:
        id: ams_empty
        width: 480
        text: "No AMS data"
        text_font: roboto_28
        text_color: 0x8888AA
        text_align: CENTER
        align: CENTER
    - label: {id: ams_hdr_l, x: 8, y: 0, width: 320, text: "", text_font: roboto_12, text_color: 0x7B9EFF, align: TOP_LEFT, hidden: true}
    - label: {id: ams_hdr_r, x: 8, y: 0, width: 320, text: "", text_font: roboto_12, text_color: 0x7B9EFF, align: TOP_LEFT, hidden: true}
    # Each AMS row: 60px tall, 62px stride.
    # Left side (x 0-143): AMS icon, name, temp/humidity, nozzle letter.
    # Right side (x 148+): 4 spool slots at x=148,231,314,397.
    #   Each slot: spool icon (32x32, y=3), type label (y=37), id label (y=48).
