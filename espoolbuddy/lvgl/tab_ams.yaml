obj:
  id: content_ams
  width: 100%
  height: 100%
  styles: sty_panel
  scrollbar_mode: "OFF"
  scrollable: false
  widgets:
    - label:
        id: ams_empty
        width: 100%
        text: "No AMS data"
        text_font: roboto_28
        text_color: 0x8888AA
        text_align: CENTER
        align: CENTER
    - label: {id: ams_hdr_l, x: 8, y: 0, width: 320, text: "", text_font: roboto_12, text_color: 0x7B9EFF, align: TOP_LEFT, hidden: true}
    - label: {id: ams_hdr_r, x: 8, y: 0, width: 320, text: "", text_font: roboto_12, text_color: 0x7B9EFF, align: TOP_LEFT, hidden: true}
    # Each AMS row: height:70 below is only a compile-time DEFAULT. The 8
    # regular rows + 5 HT/VT pair rows are all children of ams_rows_wrap, a
    # real `layout: {type: flex, flex_flow: column}` container (pad_row: 3
    # between visible rows). Regular and paired units are interleaved in
    # backend list order; how many rows are visible per page is the user's
    # Settings "Rows/Page" choice (the ams_rows_per_page global -- 1/2/3 on
    # Console, 1/2/3/5 on Panda Touch, clamped to a ${screen_height}-derived
    # per-variant max). app.yaml's AMS pagination lambda:
    #   - reorders the flex children at runtime via lv_obj_move_to_index(widget,
    #     sp) (sp = the widget's page-relative visible slot, 0..PER_PAGE-1)
    #     instead of setting x/y directly -- flex then owns the actual
    #     on-screen stacking position from that tree order, skipping hidden
    #     (off-page) rows automatically;
    #   - overrides each shown row's height via lv_obj_set_height(...) to a
    #     ROW_H derived from PER_PAGE (fewer rows per page -> bigger ROW_H),
    #     and rescales/re-fonts its icons and labels to match (see the tier
    #     table and apply_info_geom/apply_slot_geom helpers in app.yaml).
    # x/y below are unused leftovers, ignored once the parent has a `layout:`
    # set; width/height and everything inside each row IS resolution-independent
    # flex/%.
    # Left info block (0-143): AMS icon, name, temp/humidity, nozzle letter.
    # 4 spool-slot columns fill the remaining row width equally (flex_grow: 1 each).
    - obj:
        id: ams_body
        width: 100%
        height: 100%
        bg_opa: TRANSP
        border_width: 0
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false
        # pad_row: 0 -- LVGL's default obj style has a non-zero row gap; left
        # unset here it silently ate a few px between ams_rows_wrap and
        # ams_pg_bar, which the app.yaml PER_PAGE calc assumes is fully
        # available to rows (same class of bug as the root header/content/nav
        # wrapper earlier -- ams_body is a container introduced later and
        # missed that fix).
        layout: {type: flex, flex_flow: column, pad_row: 0}
        widgets:
          - obj:
              id: ams_rows_wrap
              width: 100%
              # flex_grow (not a fixed height): fills whatever vertical room
              # ams_body has left after the pagination bar, so its own pixel
              # height reflects the real screen at runtime. Individual row
              # heights are no longer fixed -- app.yaml's pagination lambda
              # computes this container's available height from the
              # ${screen_height} substitution (NOT lv_obj_get_height(), which
              # is timing-fragile right after a hide/show), divides it by the
              # user's Settings "Rows/Page" choice, and applies the resulting
              # ROW_H to each shown row every render, so fewer rows per page
              # means bigger rows filling the space instead of blank area.
              flex_grow: 1
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              scrollable: false
              layout: {type: flex, flex_flow: column, pad_row: 3}
              widgets:
                - obj:
                    id: ams_row0
                    x: 0
                    y: 0
                    width: 100%
                    height: 70
                    styles: sty_ams_row
                    scrollbar_mode: "OFF"
                    scrollable: false
                    hidden: true
                    layout: {type: FLEX, flex_flow: ROW, pad_column: 4}
                    widgets:
                      - obj:
                          id: ams0_info
                          width: 144
                          height: 100%
                          bg_opa: TRANSP
                          border_width: 0
                          pad_all: 0
                          scrollbar_mode: "OFF"
                          widgets:
                            - image: {id: ams0_icon, src: img_ams_sm, x: 6, y: 2, image_recolor: 0x7B9EFF, image_recolor_opa: COVER}
                            - image: {id: ams0_hticon, src: img_ht_sm, x: 6, y: 2, image_recolor: 0xFF9E6E, image_recolor_opa: COVER, hidden: true}
                            - image: {id: ams0_vticon, src: img_vt_sm, x: 6, y: 2, image_recolor: 0x7EC8A0, image_recolor_opa: COVER, hidden: true}
                            - label: {id: ams0_name, x: 30, y: 4, width: 94, height: 30, text: "", text_font: roboto_12, text_color: 0x7B9EFF, long_mode: DOT, align: TOP_LEFT}
                            - label: {id: ams0_th, x: 30, y: 36, width: 94, height: 30, text: "", text_font: roboto_12, text_color: 0xCCCCDD, align: TOP_LEFT}
                            - label: {id: ams0_noz, x: 128, y: 4, width: 16, text: "", text_font: roboto_16, text_color: 0x4CAF50, align: TOP_LEFT}
                      - obj:
                          id: ams0_0_slot
                          flex_grow: 1
                          height: 100%
                          bg_opa: TRANSP
                          border_width: 0
                          pad_all: 0
                          scrollbar_mode: "OFF"
                          scrollable: false
                          widgets:
                            - obj:
                                id: ams0_0_icon
                                width: 44
                                height: 44
                                align: TOP_MID
                                bg_opa: TRANSP
                                border_width: 0
                                pad_all: 0
                                scrollbar_mode: "OFF"
                                widgets:
                                  - image: {id: ams0_0_fill, src: img_spool_fill, x: 0, y: 6, image_recolor: 0x2A2A3A, image_recolor_opa: COVER, align: TOP_LEFT}
                                  - obj: {id: ams0_0_hub, x: 10, y: 16, width: 12, height: 12, radius: 6, bg_color: 0x1B1B2A, bg_opa: COVER, border_width: 1, border_color: 0x555577, pad_all: 0, scrollbar_mode: "OFF", align: TOP_LEFT}
                                  - image: {id: ams0_0_empty, src: img_spool_empty, x: 0, y: 6, image_recolor: 0x9898C0, image_recolor_opa: COVER, align: TOP_LEFT}
                                  - image: {id: ams0_0_act, src: img_spool_active, x: -2, y: 4, image_recolor: 0x4CAF50, image_recolor_opa: COVER, hidden: true, align: TOP_LEFT}
                                  - obj: {id: ams0_0_bar, x: 38, y: 6, width: 5, height: 32, bg_color: 0x454572, bg_opa: COVER, border_width: 0, radius: 2, pad_all: 0, scrollbar_mode: "OFF", hidden: true, align: TOP_LEFT}
                                  - obj: {id: ams0_0_barf, x: 38, y: 38, width: 5, height: 0, bg_color: 0x22C55E, bg_opa: COVER, border_width: 0, radius: 2, pad_all: 0, scrollbar_mode: "OFF", align: TOP_LEFT}
                            - label: {id: ams0_0_type, y: 40, width: 60, text: "", text_font: roboto_12, text_color: 0xDDDDEE, text_align: CENTER, align: TOP_MID}
                            - label: {id: ams0_0_id, y: 54, width: 60, text: "", text_font: roboto_12, text_color: 0xBBBBCC, text_align: CENTER, align: TOP_MID}
                            - obj:
                                id: hit_r0s0
                                width: 100%
