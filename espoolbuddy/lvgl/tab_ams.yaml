          # ---- AMS pagination nav bar -- fixed-height flex row, sits below
          # ams_rows_wrap inside ams_body; prev/next stay fixed-width, the page
          # label fills the middle instead of the old x:4/0/-4 absolute triplet. ----
          - obj:
              id: ams_pg_bar
              width: 100%
              height: 26
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollbar_mode: "OFF"
              layout: {type: flex, flex_flow: row, flex_align_cross: center}
              widgets:
                - button:
                    id: ams_pg_prev
                    width: 68
                    height: 26
                    styles: sty_accent_btn
                    scrollbar_mode: "OFF"
                    hidden: true
                    on_click:
                      then:
                        - lambda: "if (id(ams_page) > 0) id(ams_page)--;"
                    widgets:
                      - label: {width: 68, height: 26, text: "\U000F0141", text_font: mdi_24, text_color: 0x7BB4FF, align: CENTER}
                - label:
                    id: ams_pg_label
                    flex_grow: 1
                    height: 26
                    text: ""
                    text_font: roboto_12
                    text_color: 0xCCCCDD
                    text_align: CENTER
                    align: CENTER
                    hidden: true
                - button:
                    id: ams_pg_next
                    width: 68
                    height: 26
