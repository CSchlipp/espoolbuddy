# ============================================================================
# Console health — diagnostic binary sensors for Home Assistant.
# Included by both console bundles, next to health.yaml.
#
# A console that has lost Bambuddy or its NFC reader otherwise still looks
# healthy in HA, because WiFi and uptime are fine. These mirror the flags the
# console already tracks, so nothing new is polled. All of them are
# read-outs: the console works the same with no HA connected.
#
# Expects bambuddy_api (id: bambuddy).
# ============================================================================
esphome:
  on_boot:
    # Hide the sensors for hardware this console doesn't have, so HA doesn't
    # get an entity that stays unknown forever. Runs long before any API
    # client connects and lists the entities.
    - priority: -100
      then:
        - lambda: |-
            if (!bambuddy->has_nfc()) id(health_nfc).set_internal(true);
            if (!bambuddy->has_scale()) id(health_scale).set_internal(true);

binary_sensor:
  - platform: template
    name: "Bambuddy connection"
    id: health_bambuddy
    device_class: connectivity
    entity_category: diagnostic

  # The printer selected on the console, as Bambuddy reports it.
  - platform: template
    name: "Printer connection"
    id: health_printer
    device_class: connectivity
    entity_category: diagnostic

  # "problem" class: on = something is wrong. Hidden on a console with no NFC
  # reader or no scale configured (see on_boot above).
  - platform: template
    name: "NFC reader status"
    id: health_nfc
    device_class: problem
    entity_category: diagnostic

  - platform: template
    name: "Scale status"
    id: health_scale
    device_class: problem
    entity_category: diagnostic

interval:
  # Binary sensors publish only on change, so a short interval costs nothing
  # in HA traffic.
  - interval: 2s
    then:
      - lambda: |-
          bool backend_ok, printer_ok, nfc_ok, scale_ok;
          bambuddy->get_health(backend_ok, printer_ok, nfc_ok, scale_ok);
          // Bambuddy, the printer, the PN532 and a remote scale all take a few
          // seconds to come up after boot. Until then don't let a connection
          // start out as off, so a restart doesn't flap the sensors (and any
          // HA alert on them): before the console has registered, they would
          // read off for a moment. Once a sensor has a state it always updates.
          const bool settled = millis() >= 30000;
          if (backend_ok || settled || id(health_bambuddy).has_state())
            id(health_bambuddy).publish_state(backend_ok);
          if (printer_ok || settled || id(health_printer).has_state())
            id(health_printer).publish_state(printer_ok);
          if (!settled) return;
          if (bambuddy->has_nfc()) id(health_nfc).publish_state(!nfc_ok);
          if (bambuddy->has_scale())
            id(health_scale).publish_state(!scale_ok);
