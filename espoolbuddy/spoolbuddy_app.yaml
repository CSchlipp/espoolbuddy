          // ---- Spool picker: populate grid when recent_spools changes ----
          {
            static size_t prev_recent_count = SIZE_MAX;
            static bool   prev_loading      = false;
            static uint32_t prev_recent_gen = 0;
            bool loading = s.recent_spools_loading;
            size_t cnt   = s.recent_spools.size();
            uint32_t gen = s.recent_spools_generation;

            // gen bumps on every fetch, so a refresh repopulates the grid even
            // when the count is unchanged or the fetch finished within one tick.
            if (loading != prev_loading || cnt != prev_recent_count || gen != prev_recent_gen) {
              prev_loading      = loading;
              prev_recent_count = cnt;
              prev_recent_gen   = gen;

              // Loading / empty state
              if (loading) {
                lv_obj_clear_flag(id(nfc_picker_loading), LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(nfc_picker_loading), "Loading...");
              } else {
                lv_obj_add_flag(id(nfc_picker_loading), LV_OBJ_FLAG_HIDDEN);
              }

