              for (int si = 0; si < 9; si++) {
                if (si < (int)cnt) {
                  const auto &sp = s.recent_spools[si];
                  lv_obj_set_user_data(pb[si], (void*)(intptr_t)sp.id);
                  // Spool icon — recolour the fill layer to the filament colour
                  unsigned long cv = sp.color_hex.empty()
                                     ? 0x555577
                                     : strtoul(sp.color_hex.c_str(), nullptr, 16);
                  lv_obj_set_style_img_recolor(pf[si], lv_color_hex(cv), LV_PART_MAIN);
                  lv_obj_set_style_img_recolor_opa(pf[si], LV_OPA_COVER, LV_PART_MAIN);
                  lv_label_set_text(pm[si], sp.material.c_str());
                  lv_label_set_text(pn[si], sp.brand.c_str());
                  char idb[12];
                  snprintf(idb, sizeof(idb), "#%d", sp.id);
                  lv_label_set_text(pid[si], idb);
                  lv_obj_clear_flag(pb[si], LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_set_user_data(pb[si], (void*)(intptr_t)0);
