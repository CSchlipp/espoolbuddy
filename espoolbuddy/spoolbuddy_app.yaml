              int ds = 0, reg_used = 0, pair_used = 0;

              // Fill one side of a pair row from a single-slot unit.
              auto fill_side = [&](const bambuddy_api::AMSUnit &unit,
                                   lv_obj_t *p_ht, lv_obj_t *p_vt,
                                   lv_obj_t *p_nm, lv_obj_t *p_th, lv_obj_t *p_nz,
                                   lv_obj_t *p_fi, lv_obj_t *p_hu, lv_obj_t *p_em,
                                   lv_obj_t *p_ac,
                                   lv_obj_t *p_ty, lv_obj_t *p_id_lbl,
                                   lv_obj_t *p_bar, lv_obj_t *p_barf,
                                   const char *nz) {
                if (unit.is_vt) { lv_obj_add_flag(p_ht, LV_OBJ_FLAG_HIDDEN);
                                   lv_obj_clear_flag(p_vt, LV_OBJ_FLAG_HIDDEN); }
                else             { lv_obj_clear_flag(p_ht, LV_OBJ_FLAG_HIDDEN);
                                   lv_obj_add_flag(p_vt, LV_OBJ_FLAG_HIDDEN); }
                { char nb[40];
                  if (unit.is_vt) {
                    if (nz[0]) snprintf(nb, sizeof(nb), "Ext-%s", nz);
                    else        snprintf(nb, sizeof(nb), "Ext");
                  } else if (!unit.custom_name.empty()) {
                    snprintf(nb, sizeof(nb), "%s", unit.custom_name.c_str());
                  } else {
                    snprintf(nb, sizeof(nb), "AMS-%c", 'A' + (int)(unit.id % 26));
                  }
                  lv_label_set_text(p_nm, nb); }
                if (unit.is_vt) {
                  lv_label_set_text(p_th, "");
                } else {
                  char tb[24];
                  snprintf(tb, sizeof(tb), "%.0f\u00B0\n%d%%", unit.temp, unit.humidity);
                  lv_label_set_text(p_th, tb);
                }
                lv_label_set_text(p_nz, nz);
                bool present = !unit.trays.empty() && unit.trays[0].present;
                // Active check: which global tray ID does this single-slot unit occupy?
                //   VT external:  global_id = unit.id (254 or 255)
                //   AMS-HT:       global_id = unit.id directly (ids 128-135, NOT *4)
                //   Other single: global_id = unit.id * 4 + 0
                bool active = (s.tray_now != 255) &&
                              (unit.is_vt ? (s.tray_now == unit.id)
                                          : (unit.is_ht ? (s.tray_now == unit.id)
                                                        : (s.tray_now == unit.id * 4)));
                if (present) {
                  const auto &tr = unit.trays[0];
                  unsigned long cv = tr.color_hex.empty() ? 0x555577
                                   : strtoul(tr.color_hex.c_str(), nullptr, 16);
                  lv_obj_set_style_img_recolor(p_fi, lv_color_hex(cv), LV_PART_MAIN);
                  lv_obj_clear_flag(p_fi, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(p_hu, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(p_em, LV_OBJ_FLAG_HIDDEN);
                  lv_label_set_text(p_ty, tr.material_type.empty() ? "?" : tr.material_type.c_str());
                  if (tr.spool_id > 0) { char ib[16]; snprintf(ib, sizeof(ib), "#%d", tr.spool_id);
                                         lv_label_set_text(p_id_lbl, ib); }
                  else lv_label_set_text(p_id_lbl, "");
                } else {
                  lv_obj_add_flag(p_fi, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(p_hu, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(p_em, LV_OBJ_FLAG_HIDDEN);
                  lv_label_set_text(p_ty, ""); lv_label_set_text(p_id_lbl, "");
                }
                // Active-spool dashed ring overlay
                if (active && present) {
                  lv_obj_clear_flag(p_ac, LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(p_ac, LV_OBJ_FLAG_HIDDEN);
                }
                // Vertical fill bar — only shown when weight is known
                if (present && !unit.trays.empty() && unit.trays[0].label_weight_g > 0.0f) {
                  const auto &tr0 = unit.trays[0];
                  float pct = std::max(0.0f, std::min(1.0f, tr0.remaining_g / tr0.label_weight_g));
                  int fill_h = (int)(pct * 32.0f + 0.5f);
                  lv_obj_set_height(p_barf, fill_h);
                  lv_obj_set_y(p_barf, 38 - fill_h);
                  lv_obj_set_style_bg_color(p_barf, lv_color_hex(bambuddy_api::remaining_bar_color((int)(pct * 100.0f + 0.5f))), LV_PART_MAIN);
                  lv_obj_clear_flag(p_bar, LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(p_bar, LV_OBJ_FLAG_HIDDEN);
                  lv_obj_set_height(p_barf, 0);
                }
              };

              // Blank the B side when an odd single-slot unit has no partner.
              auto blank_b = [&](int k) {
                lv_obj_add_flag(pb_ht[k], LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(pb_vt[k], LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(pb_nm[k], ""); lv_label_set_text(pb_th[k], "");
                lv_label_set_text(pb_nz[k], "");
                lv_obj_add_flag(pb_fi[k], LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(pb_hu[k], LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(pb_em[k], LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(pb_ac[k], LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(pb_ty[k], ""); lv_label_set_text(pb_id[k], "");
                lv_obj_add_flag(pb_bar[k], LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_height(pb_barf[k], 0);
              };

              // Pending single-slot unit waiting for a pair partner (-1 = none).
              int pending_u = -1;
              const char *pending_nz = "";

              // Flush pending single-slot unit, optionally paired with u_b.
              auto flush_pending = [&](int u_b, const char *nz_b) {
                if (pair_used >= 5) { pending_u = -1; return; }
                int k = pair_used++;
                int sp = ds - page * PER_PAGE;
                ds++;
                if (sp >= 0 && sp < PER_PAGE) {
                  lv_obj_set_x(prow[k], 3);
                  lv_obj_set_y(prow[k], PAGE_Y0 + sp * STRIDE);
                  lv_obj_clear_flag(prow[k], LV_OBJ_FLAG_SCROLLABLE);
                  lv_obj_clear_flag(prow[k], LV_OBJ_FLAG_HIDDEN);
                  fill_side(s.ams_units[pending_u],
                            pa_ht[k],pa_vt[k],pa_nm[k],pa_th[k],pa_nz[k],
                            pa_fi[k],pa_hu[k],pa_em[k],pa_ac[k],pa_ty[k],pa_id[k],
                            pa_bar[k],pa_barf[k], pending_nz);
                  if (u_b >= 0)
                    fill_side(s.ams_units[u_b],
                              pb_ht[k],pb_vt[k],pb_nm[k],pb_th[k],pb_nz[k],
                              pb_fi[k],pb_hu[k],pb_em[k],pb_ac[k],pb_ty[k],pb_id[k],
                              pb_bar[k],pb_barf[k], nz_b);
                  else
                    blank_b(k);
                } else {
                  lv_obj_add_flag(prow[k], LV_OBJ_FLAG_HIDDEN);
                }
                pending_u = -1;
              };

              // Place one unit: multi-slot \u2192 regular row; single-slot \u2192 pair row.
              auto place = [&](int u, const char *nz) {
                const auto &unit = s.ams_units[u];
                if (unit.is_ht || unit.is_vt) {
                  if (pending_u < 0) { pending_u = u; pending_nz = nz; }
                  else                flush_pending(u, nz);
                } else {
                  if (reg_used >= 8) return;
                  int k = reg_used++;
                  int sp = ds - page * PER_PAGE;
                  ds++;
                  if (sp >= 0 && sp < PER_PAGE) {
                    lv_obj_set_x(row[k], 3);
                    lv_obj_set_y(row[k], PAGE_Y0 + sp * STRIDE);
                    lv_obj_clear_flag(row[k], LV_OBJ_FLAG_SCROLLABLE);
                    lv_obj_clear_flag(row[k], LV_OBJ_FLAG_HIDDEN);
                    { char nb[40];
                      if (!unit.custom_name.empty()) snprintf(nb, sizeof(nb), "%s", unit.custom_name.c_str());
                      else                           snprintf(nb, sizeof(nb), "AMS-%c", 'A' + (int)(unit.id % 26));
                      lv_label_set_text(rnm[k], nb); }
                    { char tb[24]; snprintf(tb, sizeof(tb), "%.0f\u00B0\n%d%%", unit.temp, unit.humidity);
                      lv_label_set_text(rth[k], tb); }
                    lv_label_set_text(rnz[k], nz);
                    lv_obj_clear_flag(ric[k], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(rht[k], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(rvt[k], LV_OBJ_FLAG_HIDDEN);
                    for (int j = 0; j < 4; j++) {
                      // Show a spool when physically present OR assigned (so a
                      // direct assign to an empty slot is visible). Truly-empty
                      // slots (no assignment) open the assign-by-id dialog.
                      bool pr = (j < (int)unit.trays.size()) &&
                                (unit.trays[j].present || unit.trays[j].spool_id > 0);
                      // Active (currently fed) spool: tray_now == ams_id*4 + slot
                      bool active = (s.tray_now != 255) && (s.tray_now != 254) &&
                                    (s.tray_now == unit.id * 4 + j);
                      if (pr) {
                        const auto &tr = unit.trays[j];
                        unsigned long cv = tr.color_hex.empty() ? 0x555577
                                         : strtoul(tr.color_hex.c_str(), nullptr, 16);
                        lv_obj_set_style_img_recolor(rfill[k][j], lv_color_hex(cv), LV_PART_MAIN);
                        lv_obj_clear_flag(rfill[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_obj_clear_flag(rhub[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(remp[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_label_set_text(rtype[k][j], tr.material_type.empty() ? "?" : tr.material_type.c_str());
                        if (tr.spool_id > 0) { char ib[16]; snprintf(ib, sizeof(ib), "#%d", tr.spool_id);
                                               lv_label_set_text(rid_r[k][j], ib); }
                        else lv_label_set_text(rid_r[k][j], "");
                        lv_obj_set_user_data(rhit[k][j],
                          (void*)(intptr_t)(((unsigned)unit.id << 16) | (unsigned)(tr.slot & 0xFF)));
                        lv_obj_add_flag(rhit[k][j],   LV_OBJ_FLAG_CLICKABLE);
                        lv_obj_clear_flag(rhit[k][j], LV_OBJ_FLAG_SCROLLABLE);
                        // Vertical fill bar — only shown when weight is known
                        if (tr.label_weight_g > 0.0f) {
                          float pct = std::max(0.0f, std::min(1.0f, tr.remaining_g / tr.label_weight_g));
                          int fill_h = (int)(pct * 32.0f + 0.5f);
                          lv_obj_set_height(rbarf[k][j], fill_h);
                          lv_obj_set_y(rbarf[k][j], 38 - fill_h);
                          lv_obj_set_style_bg_color(rbarf[k][j], lv_color_hex(bambuddy_api::remaining_bar_color((int)(pct * 100.0f + 0.5f))), LV_PART_MAIN);
                          lv_obj_clear_flag(rbar[k][j], LV_OBJ_FLAG_HIDDEN);
                        } else {
                          lv_obj_add_flag(rbar[k][j], LV_OBJ_FLAG_HIDDEN);
                          lv_obj_set_height(rbarf[k][j], 0);
                        }
                      } else {
                        lv_obj_add_flag(rfill[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(rhub[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_obj_clear_flag(remp[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_label_set_text(rtype[k][j], ""); lv_label_set_text(rid_r[k][j], "");
                        // Empty slot: pack ams_id+slot with bit 30 set so the hit
                        // handler opens the assign-by-id dialog instead of the modal.
                        lv_obj_set_user_data(rhit[k][j],
                          (void*)(intptr_t)(0x40000000u | ((unsigned)unit.id << 16) | (unsigned)(j & 0xFF)));
                        lv_obj_add_flag(rhit[k][j],   LV_OBJ_FLAG_CLICKABLE);
                        lv_obj_clear_flag(rhit[k][j], LV_OBJ_FLAG_SCROLLABLE);
                        lv_obj_add_flag(rbar[k][j], LV_OBJ_FLAG_HIDDEN);
                        lv_obj_set_height(rbarf[k][j], 0);
                      }
                      // Active-spool dashed ring overlay
                      if (active && pr) {
                        lv_obj_clear_flag(ract[k][j], LV_OBJ_FLAG_HIDDEN);
                      } else {
                        lv_obj_add_flag(ract[k][j], LV_OBJ_FLAG_HIDDEN);
                      }
                    }
                  } else {
                    lv_obj_add_flag(row[k], LV_OBJ_FLAG_HIDDEN);
                  }
                }
              };

              // Route units in list order so the category sort applied by the
              // backend component (regular AMS → AMS HT → Ext spools) is honoured
              // on screen.  In dual-nozzle mode each row is tagged with its own
              // nozzle letter (L/R) rather than grouping all-L-then-all-R — the
              // old grouping floated a left-nozzle external spool above the AMS
              // units, breaking the requested order.
              for (int u = 0; u < n_ams; u++) {
                const char *nz = "";
                if (s.dual_nozzle) {
                  int nv = s.ams_units[u].nozzle;
                  nz = (nv == 1) ? "L" : (nv == 0) ? "R" : "";
                }
                place(u, nz);
              }
              if (pending_u >= 0) flush_pending(-1, "");

              // Hide unused widget slots
              for (int k = reg_used;  k < 8; k++) lv_obj_add_flag(row[k],  LV_OBJ_FLAG_HIDDEN);
              for (int k = pair_used; k < 5; k++) lv_obj_add_flag(prow[k], LV_OBJ_FLAG_HIDDEN);

              // Disable scrolling on the AMS container (nav buttons replace drag-scroll)
              lv_obj_clear_flag(id(content_ams), LV_OBJ_FLAG_SCROLLABLE);

              // Pagination nav bar
              {
                int total_slots = ds;
                int max_page = (total_slots + PER_PAGE - 1) / PER_PAGE;
                if (max_page < 1) max_page = 1;
                if (page >= max_page) { id(ams_page) = max_page - 1; }
                bool show_nav = (max_page > 1);
                if (show_nav) {
                  lv_obj_clear_flag(id(ams_pg_prev), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(ams_pg_next), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(ams_pg_label), LV_OBJ_FLAG_HIDDEN);
                  if (page == 0)
                    lv_obj_add_state(id(ams_pg_prev), LV_STATE_DISABLED);
                  else
                    lv_obj_clear_state(id(ams_pg_prev), LV_STATE_DISABLED);
                  if (page >= max_page - 1)
                    lv_obj_add_state(id(ams_pg_next), LV_STATE_DISABLED);
                  else
                    lv_obj_clear_state(id(ams_pg_next), LV_STATE_DISABLED);
                  char pb[16]; snprintf(pb, sizeof(pb), "%d / %d", page + 1, max_page);
                  lv_label_set_text(id(ams_pg_label), pb);
                } else {
                  lv_obj_add_flag(id(ams_pg_prev),  LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(ams_pg_next),  LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(ams_pg_label), LV_OBJ_FLAG_HIDDEN);
                }
              }
            } // end if (ams_dirty)

            // ---- AMS removed spool toast (runs every tick, not gated on ams_dirty) ----
            {
              bool toast_on = s.ams_removed_toast_expiry_ms > 0 &&
                              millis() < s.ams_removed_toast_expiry_ms;
              if (toast_on) {
                lv_obj_clear_flag(id(ams_removed_toast), LV_OBJ_FLAG_HIDDEN);
                lv_label_set_text(id(ams_removed_toast_lbl), s.ams_removed_spool_desc.c_str());
              } else {
                lv_obj_add_flag(id(ams_removed_toast), LV_OBJ_FLAG_HIDDEN);
              }
            }
          } // end dirty-check block

          // ---- Settings tab: printer list ----
          {
            int np = (int) s.printers.size();
            int sel = s.selected_printer_idx;
            lv_obj_t *pbtn[5] = {id(cfg_p0), id(cfg_p1), id(cfg_p2), id(cfg_p3), id(cfg_p4)};
            lv_obj_t *pnm[5]  = {id(cfg_p0_n), id(cfg_p1_n), id(cfg_p2_n), id(cfg_p3_n), id(cfg_p4_n)};
            lv_obj_t *pdot[5] = {id(cfg_p0_d), id(cfg_p1_d), id(cfg_p2_d), id(cfg_p3_d), id(cfg_p4_d)};
            if (np == 0) lv_obj_clear_flag(id(cfg_empty), LV_OBJ_FLAG_HIDDEN);
            else         lv_obj_add_flag(id(cfg_empty), LV_OBJ_FLAG_HIDDEN);
            for (int i = 0; i < 5; i++) {
              if (i >= np) { lv_obj_add_flag(pbtn[i], LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_clear_flag(pbtn[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(pnm[i], s.printers[i].name.c_str());
              lv_obj_set_style_text_color(pnm[i],
                  i == sel ? lv_color_hex(0x7BB4FF) : lv_color_hex(0xDDDDEE), LV_PART_MAIN);
              lv_label_set_text(pdot[i], "\U000F0765");
              // For the selected printer use printer_connected (from status API);
              // for others fall back to the list-endpoint online field.
              bool dot_ok = (i == sel) ? s.printer_connected : s.printers[i].online;
              lv_obj_set_style_text_color(pdot[i],
                  dot_ok ? lv_color_hex(0x4CAF50) : lv_color_hex(0xF44336),
                  LV_PART_MAIN);
            }
            // Selected-printer summary line on the main Settings screen (the
            // picker list above now lives in printer_modal).
            if (np > 0 && sel >= 0 && sel < np) {
              lv_label_set_text(id(lbl_printer_sel), s.printers[sel].name.c_str());
              lv_obj_set_style_text_color(id(lbl_printer_sel_icon),
                  s.printer_connected ? lv_color_hex(0x4CAF50) : lv_color_hex(0xF44336),
                  LV_PART_MAIN);
            } else {
              lv_label_set_text(id(lbl_printer_sel), np > 0 ? "Select printer" : "No printers");
              lv_obj_set_style_text_color(id(lbl_printer_sel_icon), lv_color_hex(0x666688), LV_PART_MAIN);
            }
          }

