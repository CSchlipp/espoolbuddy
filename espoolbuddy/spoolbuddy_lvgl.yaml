              # ================ SPOOL DETAIL MODAL ================
              # Single card — no full-screen dim backdrop.  Removing the backdrop
              # keeps the dirty area to the card bounds only (~3 DMA stripes at
              # 25 % buffer vs 4 for a full-screen overlay), which eliminates the
              # visible top-to-bottom repaint sweep.  The card is visually
              # distinguished by a bright border + drop shadow instead.
              - obj:
                  id: ams_modal_card
                  x: 20
                  y: 46
                  width: 440
                  height: 226
                  bg_color: 0x1A1A2C
                  bg_opa: COVER
                  border_color: 0x8585B8
