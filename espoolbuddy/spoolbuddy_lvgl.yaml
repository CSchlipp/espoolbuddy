                                lv_label_set_text(id(confirm_msg), "Clear this slot's spool assignment?");
                                lv_label_set_text(id(confirm_ok_lbl), "Clear");
                                lv_obj_clear_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                        widgets:
