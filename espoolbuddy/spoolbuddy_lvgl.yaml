                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                float v = id(cal_ref_weight) + 100.0f;
                                if (v > 5000.0f) v = 5000.0f;
                                id(cal_ref_weight) = v;
                                char buf[12]; snprintf(buf, sizeof(buf), "%.0f g", v);
                                lv_label_set_text(id(lbl_cal_weight), buf);
                        widgets:
                          - label: {text: "+100", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                    # ---- Separator ----
                    - obj:
                        x: 12
                        y: 124
                        width: 416
                        height: 1
                        bg_color: 0x454572
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        scrollbar_mode: "OFF"
                    # ---- Cancel / Confirm buttons ----
                    - button:
                        id: btn_cal_cancel
                        x: 12
                        y: 134
                        width: 190
                        height: 38
                        bg_color: 0x1E2040
                        border_color: 0x8585B8
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: "lv_obj_add_flag(id(cal_modal), LV_OBJ_FLAG_HIDDEN);"
                        widgets:
                          - label: {text: "Cancel", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                    - button:
                        id: btn_cal_confirm
                        x: 218
                        y: 134
                        width: 210
                        height: 38
                        bg_color: 0x1E2040
                        border_color: 0x4ECDC4
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                lv_obj_add_flag(id(cal_modal), LV_OBJ_FLAG_HIDDEN);
                                bambuddy->request_calibration(id(cal_ref_weight));
                        widgets:
                          - label: {text: "Calibrate", text_font: roboto_16, text_color: 0x4ECDC4, align: CENTER}

              # ================ CONFIRM MODAL ================================
              # Reusable confirmation for destructive actions. confirm_action
              # (global) selects what runs on confirm: 1=unlink tag, 2=clear
              # assignment. Declared before the wake guard so it overlays the AMS
              # detail modal (clear assignment is triggered from inside it).
              - obj:
                  id: confirm_modal
                  x: 20
                  y: 80
                  width: 440
                  height: 160
                  bg_color: 0x1A1A2C
                  bg_opa: COVER
                  border_color: 0x8585B8
                  border_width: 2
                  border_opa: COVER
                  radius: 12
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  shadow_width: 16
                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  widgets:
                    - label:
                        x: 16
                        y: 16
                        width: 408
                        text: "Are you sure?"
                        text_font: roboto_20
                        text_color: 0x7BB4FF
                        align: TOP_LEFT
                    - label:
                        id: confirm_msg
                        x: 16
                        y: 52
                        width: 408
                        height: 40
                        text: ""
                        text_font: roboto_16
                        text_color: 0xDDDDEE
                        long_mode: WRAP
                        align: TOP_LEFT
                    - button:
                        id: confirm_cancel_btn
                        x: 12
                        y: 104
                        width: 200
                        height: 40
                        bg_color: 0x1E2040
                        border_color: 0x8585B8
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                id(confirm_action) = 0;
                                lv_obj_add_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                        widgets:
                          - label: {text: "Cancel", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                    - button:
                        id: confirm_ok_btn
                        x: 228
                        y: 104
                        width: 200
                        height: 40
                        bg_color: 0x3D0A0A
                        border_color: 0xCC3333
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                int a = id(confirm_action);
                                id(confirm_action) = 0;
                                lv_obj_add_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                                if (a == 1) {
                                  bambuddy->unlink_current_tag();
                                } else if (a == 2) {
                                  bambuddy->clear_slot_assignment(id(modal_ams_id), id(modal_tray_slot));
                                  lv_obj_add_flag(id(ams_modal_card), LV_OBJ_FLAG_HIDDEN);
                                } else if (a == 3) {
                                  id(restart_button).press();  // reboot the console
                                }
                        widgets:
                          - label: {id: confirm_ok_lbl, text: "Confirm", text_font: roboto_16, text_color: 0xFF8888, align: CENTER}

              # ================ ASSIGN-BY-ID MODAL ===========================
              # Assign an inventory spool to an empty AMS slot by ID (no scan).
              # modal_ams_id / modal_tray_slot hold the target slot.
              - obj:
                  id: assign_id_modal
                  x: 20
                  y: 64
                  width: 440
                  height: 172
                  bg_color: 0x1A1A2C
                  bg_opa: COVER
                  border_color: 0x8585B8
                  border_width: 2
                  border_opa: COVER
                  radius: 12
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  shadow_width: 16
                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  widgets:
                    - label:
                        id: slot_assign_title
                        x: 16
                        y: 14
                        width: 408
                        text: "Assign Spool"
                        text_font: roboto_20
                        text_color: 0x7BB4FF
                        long_mode: DOT
                        align: TOP_LEFT
                    # ---- ID chooser: -10 / - / ID:X / + / +10 ----
                    - button:
                        id: btn_slot_id_m10
                        x: 12
                        y: 56
                        width: 60
                        height: 40
                        bg_color: 0x1E1E30
                        border_color: 0x3A3A56
                        border_width: 1
                        radius: 4
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                int v=(int)id(slot_assign_id)-10; if(v<1)v=1; id(slot_assign_id)=v;
                                char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                        widgets:
                          - label: {text: "-10", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                    - button:
                        id: btn_slot_id_m1
                        x: 78
                        y: 56
                        width: 48
                        height: 40
                        bg_color: 0x1E1E30
                        border_color: 0x3A3A56
                        border_width: 1
                        radius: 4
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                if((int)id(slot_assign_id)>1) id(slot_assign_id)--;
                                int v=(int)id(slot_assign_id);
                                char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                        widgets:
                          - label: {text: "-", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                    - label:
                        id: lbl_slot_assign_id
                        x: 132
                        y: 64
                        width: 176
                        text: "ID: 1"
                        text_font: roboto_20
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        align: TOP_LEFT
                    - button:
                        id: btn_slot_id_p1
                        x: 314
                        y: 56
                        width: 48
                        height: 40
                        bg_color: 0x1E1E30
                        border_color: 0x3A3A56
                        border_width: 1
                        radius: 4
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                id(slot_assign_id)++;
                                int v=(int)id(slot_assign_id);
                                char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                        widgets:
                          - label: {text: "+", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}
                    - button:
                        id: btn_slot_id_p10
                        x: 368
                        y: 56
                        width: 60
                        height: 40
                        bg_color: 0x1E1E30
                        border_color: 0x3A3A56
                        border_width: 1
                        radius: 4
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                int v=(int)id(slot_assign_id)+10; id(slot_assign_id)=v;
                                char b[16]; snprintf(b,sizeof(b),"ID: %d",v); lv_label_set_text(id(lbl_slot_assign_id),b);
                        widgets:
                          - label: {text: "+10", text_font: roboto_12, text_color: 0xDDDDEE, align: CENTER}
                    # ---- Assign | Cancel ----
                    - button:
                        id: btn_slot_assign_ok
                        x: 12
                        y: 116
                        width: 200
                        height: 40
                        bg_color: 0x0D2B14
                        border_color: 0x4CAF50
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                int sid=(int)id(slot_assign_id);
                                if(sid>0) bambuddy->assign_spool_to_slot(sid, id(modal_ams_id), id(modal_tray_slot));
                                lv_obj_add_flag(id(assign_id_modal), LV_OBJ_FLAG_HIDDEN);
                        widgets:
                          - label: {text: "Assign", text_font: roboto_16, text_color: 0x4CAF50, align: CENTER}
                    - button:
                        id: btn_slot_assign_cancel
                        x: 228
                        y: 116
                        width: 200
                        height: 40
                        bg_color: 0x1E2040
                        border_color: 0x8585B8
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: "lv_obj_add_flag(id(assign_id_modal), LV_OBJ_FLAG_HIDDEN);"
                        widgets:
                          - label: {text: "Cancel", text_font: roboto_16, text_color: 0xDDDDEE, align: CENTER}

              # ================ PLATE CLEAR POPUP =============================
              # Almost-full-screen confirmation shown when the backend reports
              # awaiting_plate_clear (gated by the "Plate Clear" settings toggle;
              # see plate_clear_confirm_enabled / update_plateclear_btn and the
              # show/hide logic in the interval lambda). Confirm notifies the
              # backend via bambuddy->confirm_plate_cleared(); Discard just
              # closes the popup locally without notifying the backend.
              - obj:
                  id: plate_clear_popup
                  x: 20
                  y: 20
                  width: 440
                  height: 280
                  bg_color: 0x1B5E20
                  bg_opa: COVER
                  border_color: 0x4CAF50
                  border_width: 3
                  border_opa: COVER
                  radius: 16
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  shadow_width: 20
                  shadow_offset_x: 0
                  shadow_offset_y: 8
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  widgets:
                    # align: TOP_MID treats x/y as an offset from the centred
                    # anchor point, not an absolute coordinate — combined with
                    # a nonzero x that silently shifts the "centred" text off
                    # centre. Use TOP_LEFT (absolute x) with a width/x pair
                    # that's symmetric within the 440px popup instead, and let
                    # text_align: CENTER centre the text inside that box.
                    - label:
                        x: 16
                        y: 30
                        width: 408
                        height: 48
                        text: "\U000F1276"
                        text_font: mdi_48
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        align: TOP_LEFT
                    - label:
                        x: 16
                        y: 96
                        width: 408
                        text: "Build Plate Clear"
                        text_font: roboto_28
                        text_color: 0xFFFFFF
                        text_align: CENTER
                        align: TOP_LEFT
                    - label:
                        x: 32
                        y: 158
                        width: 376
                        height: 56
                        text: "Please confirm that the build plate has been cleared."
                        text_font: roboto_16
                        text_color: 0xE8F5E9
                        text_align: CENTER
                        long_mode: WRAP
                        align: TOP_LEFT
                    - button:
                        id: btn_plateclear_discard
                        x: 20
                        y: 228
                        width: 190
                        height: 40
                        bg_color: 0x0F3D14
                        border_color: 0xA5D6A7
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                id(plate_clear_popup_open) = 0;
                                // Suppress the popup until awaiting_plate_clear is next observed
                                // false — see the interval lambda in spoolbuddy_app.yaml.
                                id(plate_clear_dismissed) = 1;
                                lv_obj_add_flag(id(plate_clear_popup), LV_OBJ_FLAG_HIDDEN);
                                bambuddy->dismiss_plate_clear_popup();
                        widgets:
                          - label: {text: "Discard", text_font: roboto_16, text_color: 0xE8F5E9, align: CENTER}
                    - button:
                        id: btn_plateclear_confirm
                        x: 230
                        y: 228
                        width: 190
                        height: 40
                        bg_color: 0xFFFFFF
                        border_color: 0xFFFFFF
                        border_width: 2
                        radius: 6
                        scrollbar_mode: "OFF"
                        on_click:
                          then:
                            - lambda: |-
                                id(plate_clear_popup_open) = 0;
                                lv_obj_add_flag(id(plate_clear_popup), LV_OBJ_FLAG_HIDDEN);
                                bambuddy->confirm_plate_cleared();
                        widgets:
                          - label: {text: "Confirm", text_font: roboto_16, text_color: 0x1B5E20, align: CENTER}

              # ================ WAKE GUARD ====================================
              # Full-screen transparent overlay that sits on top of all other
              # widgets.  Shown by on_idle when the backlight dims; absorbs the
              # first touch that wakes the screen so underlying buttons aren't
              # accidentally triggered.  Hidden again by its own on_click, and
              # also by the weight-placement wake path in spoolbuddy_app.yaml.
              - obj:
                  id: wake_guard
                  x: 0
                  y: 0
                  width: 480
                  height: 320
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  hidden: true
                  on_click:
                    then:
                      - lambda: |-
                          lv_obj_add_flag(id(wake_guard), LV_OBJ_FLAG_HIDDEN);
                          // Waking from Dim (not deep sleep): restore user-configured brightness.
                          // Deep-sleep wake is handled by the interval lambda (is_sleeping path).
                          if (!id(is_sleeping)) {
                            id(display_backlight).turn_on()
                              .set_brightness(id(backlight_brightness_pct) / 100.0f)
                              .set_transition_length(150).perform();
                          }

  on_idle:
    timeout: 60s
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 20%
          transition_length: 2s
      - lambda: "lv_obj_clear_flag(id(wake_guard), LV_OBJ_FLAG_HIDDEN);"

