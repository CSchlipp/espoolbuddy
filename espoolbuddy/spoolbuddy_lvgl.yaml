                  border_opa: COVER
                  radius: 12
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  shadow_width: 16
                  shadow_offset_x: 0
                  shadow_offset_y: 6
                  shadow_spread: 2
                  shadow_color: 0x000000
                  shadow_opa: COVER
                  hidden: true
                  widgets:
                    # ---- Spool icon (80×80) — left column ----
                    - obj:
                        x: 12
                        y: 12
                        width: 80
                        height: 80
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - image: {id: modal_spool_fill,  src: img_spool_fill_lg,  align: CENTER, image_recolor: 0x6666AA, image_recolor_opa: COVER}
                          - obj: {id: modal_spool_hub, align: CENTER, width: 30, height: 30, radius: 15, bg_color: 0x1A1A2C, bg_opa: COVER, border_width: 1, border_color: 0x555577, pad_all: 0, scrollbar_mode: "OFF"}
                          - image: {id: modal_spool_shine, src: img_spool_shine_lg, align: CENTER}
                    # Spool ID — below icon in left column (hidden when no inventory ID)
                    - label: {id: modal_spoolid, x: 12, y: 96, width: 80, height: 14, text: "", text_font: roboto_12, text_color: 0xBBBBCC, text_align: CENTER, align: TOP_LEFT, hidden: true}
                    # ---- Right column text layout (x=104) ----
                    #  y: 12  [Brand ── 324 px ─────────────────────────────── ]
                    #  y: 36  [Material type + subtype ── 324 px ──────────────]
                    #  y: 70  [swatch][hex]               | [temp range        ]
                    #  y: 92  (left col: icon ends y=92)  | [AMS name roboto_16]
                    #  y:110                                  [Slot X   roboto_12]
                    #  y:126  [weight cur roboto_16]         [weight tot right  ]
                    #  y:148  [═══════ weight bar 324 px ═══════════════════════]
                    #  y:172  ─── separator ──────────────────────────────────
                    #  y:180  [Clear Assignment  200px] [Close  200px]
                    - label: {id: modal_brand,        x: 104, y: 12,  width: 324, height: 22, text: "", text_font: roboto_20, text_color: 0xBBBBCC, long_mode: DOT,  align: TOP_LEFT}
                    - label: {id: modal_type,         x: 104, y: 36,  width: 324, height: 32, text: "", text_font: roboto_28, text_color: 0xFFFFFF, long_mode: DOT,  align: TOP_LEFT}
                    # Col-A row 3 — colour
                    - obj:   {id: modal_color_swatch,  x: 104, y: 70,  width: 52,  height: 20, bg_color: 0x555577, bg_opa: COVER, border_color: 0x8888AA, border_width: 1, radius: 3, scrollbar_mode: "OFF"}
                    - label: {id: modal_colorhex,      x: 162, y: 73,  width: 164, height: 16, text: "", text_font: roboto_12, text_color: 0xBBBBCC,  long_mode: DOT, align: TOP_LEFT}
                    # Col-B — temperature, AMS name (line 1) + slot number (line 2)
                    - label: {id: modal_temps,         x: 272, y: 70,  width: 156, height: 20, text: "", text_font: roboto_16, text_color: 0xDDDDEE,  align: TOP_LEFT}
                    - label: {id: modal_slotinfo,      x: 272, y: 92,  width: 156, height: 18, text: "", text_font: roboto_16, text_color: 0x7B9EFF,  long_mode: DOT, align: TOP_LEFT}
                    - label: {id: modal_slotnum,       x: 272, y: 110, width: 156, height: 14, text: "", text_font: roboto_12, text_color: 0x5566BB,  align: TOP_LEFT}
                    # Weight row — current weight (left, larger) + total (right, muted)
                    - label: {id: modal_weight_cur,    x: 104, y: 126, width: 160, height: 18, text: "", text_font: roboto_16, text_color: 0xDDDDEE,  align: TOP_LEFT, hidden: true}
                    - label: {id: modal_weight_tot,    x: 268, y: 128, width: 160, height: 16, text: "", text_font: roboto_12, text_color: 0x8888AA,  text_align: RIGHT, align: TOP_LEFT, hidden: true}
                    # Weight bar — full col-A+B width
                    - bar:
                        id: modal_weight_bar
                        x: 104
                        y: 148
                        width: 324
                        height: 20
                        min_value: 0
                        max_value: 100
                        value: 0
                        bg_color: 0x2A2A3C
                        bg_opa: COVER
                        border_width: 0
                        radius: 5
                        pad_all: 0
                        hidden: true
