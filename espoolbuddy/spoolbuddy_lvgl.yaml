# ============================================================================
# LVGL — 480×320 SpoolBuddy UI
#
#   Header     y=0    h=30   title + status message + wifi + api icons
#   Content    y=30   h=250  one of 4 stacked containers (Scale/NFC/AMS/Cfg)
#   Bottom nav y=280  h=40   4 icon buttons
# ============================================================================
lvgl:
  displays:
    - main_display
  touchscreens:
    - touch_screen
  buffer_size: 50%
  color_depth: 16
  rotation: 90
  bg_color: 0x12121A
  default_font: roboto_16

  style_definitions:
    - id: sty_bar
      bg_color: 0x0D0D16
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: sty_panel
      bg_color: 0x12121A
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: sty_card
      bg_color: 0x1B1B2A
      bg_opa: COVER
      border_width: 0
      radius: 6
      pad_all: 0
    - id: sty_ams_row
      bg_color: 0x1B1B2A
      bg_opa: COVER
      border_width: 1
      border_color: 0x454572
      border_opa: COVER
      radius: 6
      pad_all: 0
    - id: sty_navbtn
      bg_color: 0x0D0D16
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
    - id: sty_accent_btn
      bg_color: 0x1A2A50
      border_color: 0x4A7ACC
      border_width: 1
      text_color: 0x7BB4FF
      radius: 6

  pages:
    - id: main_page
      widgets:
        - obj:
            width: 480
            height: 320
            bg_color: 0x12121A
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:

              # ---------------- HEADER (y0 h30) ----------------
              # Title (left) + scrolling status message (middle) + wifi/api
              # status icons (right), all on one bar. Folding the status into
              # the header reclaims the old 24px status strip for the content.
              - obj:
                  x: 0
                  y: 0
                  width: 480
                  height: 30
                  styles: sty_bar
                  scrollbar_mode: "OFF"
                  widgets:
                    - label:
                        x: 8
                        y: 0
                        height: 30
                        # "EspoolBuddy" — pun on ESP(32) + SpoolBuddy. The "Esp"
                        # is highlighted in the accent colour via LVGL recolor.
                        text: "#4ECDC4 Esp#oolBuddy"
                        text_font: roboto_20
                        text_color: 0xE0E0FF
                        recolor: true
                        align: LEFT_MID
                    # Clock + status share one slot centred between the title and
                    # the status icons. The UI interval lambda shows the status
                    # message (scrolling) when there is one, else the clock. Both
                    # have no fixed height so the LEFT_MID anchor centres them
                    # vertically (matching the icons).
                    - label:
                        id: lbl_status
                        x: 132
                        y: 0
                        width: 224
                        text: ""
                        text_font: roboto_12
                        text_color: 0xCCCCDD
                        long_mode: SCROLL_CIRCULAR
                        text_align: CENTER
                        align: LEFT_MID
                        hidden: true
                    - label:
                        id: lbl_clock
                        x: 132
                        y: 0
                        width: 224
                        text: "--:--"
                        text_font: roboto_16
                        text_color: 0xE0E0FF
                        text_align: CENTER
                        align: LEFT_MID
                    - label:
                        id: ic_wifi
                        x: 360
                        y: 0
                        width: 28
                        height: 30
                        text: "\U000F05AA"
                        text_font: mdi_24
                        text_color: 0x8585B8
                        align: LEFT_MID
                    - label:
                        id: ic_api
                        x: 388
                        y: 0
                        width: 28
                        height: 30
                        text: "\U000F0164"
                        text_font: mdi_24
                        text_color: 0x8585B8
                        align: LEFT_MID
                    - label:
                        id: ic_scale
                        x: 416
                        y: 0
                        width: 28
                        height: 30
                        text: "\U000F0472"
                        text_font: mdi_24
                        text_color: 0x8585B8
                        align: LEFT_MID
                    - label:
                        id: ic_printer
                        x: 444
                        y: 0
                        width: 28
                        height: 30
                        text: "\U000F042B"
                        text_font: mdi_24
                        text_color: 0x8585B8
                        align: LEFT_MID

              # ================ CONTENT: SCALE ================
              - obj:
                  id: content_scale
                  x: 0
                  y: 30
                  width: 480
                  height: 250
                  styles: sty_panel
                  scrollbar_mode: "OFF"
                  hidden: true
                  widgets:
                    - label:
                        x: 0
                        y: 48
                        width: 480
                        text: "WEIGHT"
                        text_font: roboto_16
                        text_color: 0x7B9EFF
                        text_align: CENTER
                        align: TOP_MID
                    - label:
                        id: lbl_weight
                        x: 0
                        y: 76
                        width: 480
                        text: ""
                        text_font: roboto_40
                        text_color: 0x4ECDC4
                        text_align: CENTER
                        align: TOP_MID
                    - label:
                        id: lbl_weight_stable
                        x: 0
                        y: 134
                        width: 480
                        text: ""
                        text_font: roboto_16
                        text_color: 0x8888AA
                        text_align: CENTER
                        align: TOP_MID

                    # ---- Action buttons — bottom row, same layout as NFC tab ----
                    - button:
                        id: btn_tare
                        x: 8
                        y: 188
                        width: 228
                        height: 50
                        styles: sty_accent_btn
                        on_click:
                          then:
                            - lambda: bambuddy->request_tare();
                        widgets:
                          - label:
                              text: "TARE"
                              text_font: roboto_16
                              text_color: 0x7BB4FF
                              align: CENTER
                    - button:
                        id: btn_calibrate
                        x: 244
                        y: 188
                        width: 228
                        height: 50
                        styles: sty_accent_btn
                        on_click:
                          then:
                            - lambda: |-
                                char buf[10];
                                snprintf(buf, sizeof(buf), "%.0f g", id(cal_ref_weight));
                                lv_label_set_text(id(lbl_cal_weight), buf);
                                lv_obj_clear_flag(id(cal_modal), LV_OBJ_FLAG_HIDDEN);
                        widgets:
                          - label:
                              text: "CALIBRATE"
                              text_font: roboto_16
                              text_color: 0x7BB4FF
                              align: CENTER

              - !include lvgl/tab_nfc.yaml

              - !include lvgl/tab_ams.yaml

              # ================ CONTENT: SETTINGS (printer selection) ==========
              - obj:
                  id: content_cfg
                  x: 0
                  y: 30
                  width: 480
                  height: 250
                  styles: sty_panel
                  scrollbar_mode: "OFF"
                  hidden: true
                  widgets:
                    # ---- Header: section title ----
                    - obj:
                        x: 0
                        y: 0
                        width: 480
                        height: 28
                        styles: sty_bar
                        scrollbar_mode: "OFF"
                        widgets:
                          - label:
                              x: 0
                              width: 480
                              text: "Settings"
                              text_font: roboto_20
                              text_color: 0x7B9EFF
                              text_align: CENTER
                              align: CENTER
                    # Thin separator below the header
                    - obj:
                        x: 0
                        y: 28
                        width: 480
                        height: 1
                        bg_color: 0x454572
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        scrollbar_mode: "OFF"

                    # ==== Settings menu: two category rows opening full-page subpages ====
                    # ---- Row: System (printer, brightness, sleep, reboot) ----
                    - obj:
                        x: 0
                        y: 36
                        width: 480
                        height: 42
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - button:
                              id: btn_system_page
                              x: 8
                              y: 3
                              width: 464
                              height: 36
                              styles: sty_card
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: 'lv_obj_clear_flag(id(content_system), LV_OBJ_FLAG_HIDDEN);'
                              widgets:
                                - label: {x: 16, width: 400, text: "System", text_font: roboto_16, text_color: 0xDDDDEE, align: LEFT_MID}
                                - label: {x: 424, width: 24, text: "\U000F0142", text_font: mdi_24, text_color: 0x7B9EFF, align: LEFT_MID}

                    # ---- Row: Features (sound, plate-clear confirm) ----
                    - obj:
                        x: 0
                        y: 82
                        width: 480
                        height: 42
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        widgets:
                          - button:
                              id: btn_features_page
                              x: 8
                              y: 3
                              width: 464
                              height: 36
                              styles: sty_card
                              scrollbar_mode: "OFF"
                              on_click:
                                then:
                                  - lambda: 'lv_obj_clear_flag(id(content_features), LV_OBJ_FLAG_HIDDEN);'
                              widgets:
                                - label: {x: 16, width: 400, text: "Features", text_font: roboto_16, text_color: 0xDDDDEE, align: LEFT_MID}
                                - label: {x: 424, width: 24, text: "\U000F0142", text_font: mdi_24, text_color: 0x7B9EFF, align: LEFT_MID}

                    # ---- App version (bottom-right; text set in apply_tab from
                    #      esphome.project.version via ESPHOME_PROJECT_VERSION) ----
                    - label:
                        id: lbl_version
                        text: ""
                        text_font: roboto_12
                        text_color: 0x8585B8
                        x: 10
                        y: 6
                        align: TOP_LEFT

                    # ---- System subpage (overlays full content_cfg area) ----
                    # Printer | Brightness | Sleep (opens the nested content_sleep
                    # subpage) | Reboot (confirms via confirm_modal).
                    - obj:
                        id: content_system
                        x: 0
                        y: 0
                        width: 480
                        height: 250
                        bg_color: 0x12121A
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        hidden: true
                        widgets:
                          # Header with back button
                          - obj:
                              x: 0
                              y: 0
                              width: 480
                              height: 28
                              styles: sty_bar
                              scrollbar_mode: "OFF"
                              widgets:
                                - button:
                                    x: 0
                                    y: 0
                                    width: 40
                                    height: 28
                                    bg_opa: TRANSP
                                    border_width: 0
                                    radius: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'lv_obj_add_flag(id(content_system), LV_OBJ_FLAG_HIDDEN);'
                                    widgets:
                                      - label: {text: "\U000F0141", text_font: mdi_24, text_color: 0x7B9EFF, align: CENTER}
                                - label:
                                    x: 0
                                    width: 480
                                    text: "System"
                                    text_font: roboto_20
                                    text_color: 0x7B9EFF
                                    text_align: CENTER
                                    align: CENTER
                          # Separator
                          - obj:
                              x: 0
                              y: 28
                              width: 480
                              height: 1
                              bg_color: 0x454572
                              bg_opa: COVER
                              border_width: 0
                              radius: 0
                              scrollbar_mode: "OFF"

                          # ---- Row: selected printer (tap the value to open the picker popup) ----
                          - obj:
                              x: 0
                              y: 36
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 110
                                    text: "Printer"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - button:
                                    id: btn_printer_pick
                                    x: 150
                                    y: 3
                                    width: 320
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'lv_obj_clear_flag(id(printer_modal), LV_OBJ_FLAG_HIDDEN);'
                                    widgets:
                                      - label: {id: lbl_printer_sel_icon, x: 8, width: 24, text: "\U000F0765", text_font: mdi_24, text_color: 0x666688, align: LEFT_MID}
                                      - label: {id: lbl_printer_sel, x: 38, width: 228, text: "—", text_font: roboto_16, text_color: 0xDDDDEE, long_mode: DOT, align: LEFT_MID}
                                      - label: {x: 296, width: 24, text: "\U000F0142", text_font: mdi_24, text_color: 0x7B9EFF, align: LEFT_MID}

                          # ---- Row: Backlight brightness (slider 25–100%, 5% steps) ----
                          - obj:
                              x: 0
                              y: 78
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 130
                                    text: "Brightness"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - slider:
                                    id: sl_brightness
                                    x: 148
                                    y: 11
                                    width: 274
                                    height: 16
                                    min_value: 25
                                    max_value: 100
                                    value: 100
                                    on_value:
                                      then:
                                        - lambda: |-
                                            // Snap to 5% steps and store. Inline to avoid circular
                                            // trigger: update_backlight_brightness → lv_slider_set_value
                                            // → on_value → update_backlight_brightness → ...
                                            int snapped = ((x + 2) / 5) * 5;
                                            if (snapped < 25) snapped = 25;
                                            if (snapped > 100) snapped = 100;
                                            id(backlight_brightness_pct) = snapped;
                                            id(display_backlight).turn_on()
                                              .set_brightness(snapped / 100.0f)
                                              .set_transition_length(50).perform();
                                            char buf[6];
                                            snprintf(buf, sizeof(buf), "%d%%", snapped);
                                            lv_label_set_text(id(lbl_brightness_val), buf);
                                - label:
                                    id: lbl_brightness_val
                                    x: 430
                                    width: 46
                                    text: "100%"
                                    text_font: roboto_16
                                    text_color: 0xDDDDEE
                                    text_align: RIGHT
                                    align: LEFT_MID

                          # ---- Row: Sleep settings (opens the nested sleep subpage) ----
                          - obj:
                              x: 0
                              y: 120
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 110
                                    text: "Sleep"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - button:
                                    id: btn_sleep_page
                                    x: 150
                                    y: 3
                                    width: 320
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'lv_obj_clear_flag(id(content_sleep), LV_OBJ_FLAG_HIDDEN);'
                                    widgets:
                                      - label: {x: 8, width: 280, text: "Sleep settings", text_font: roboto_16, text_color: 0xDDDDEE, align: LEFT_MID}
                                      - label: {x: 296, width: 24, text: "\U000F0142", text_font: mdi_24, text_color: 0x7B9EFF, align: LEFT_MID}

                          # ---- Row: Reboot (confirms via confirm_modal) ----
                          - obj:
                              x: 0
                              y: 162
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 110
                                    text: "Reboot"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - button:
                                    id: btn_reboot
                                    x: 150
                                    y: 3
                                    width: 320
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: |-
                                            id(confirm_action) = 3;
                                            lv_label_set_text(id(confirm_msg), "Reboot the console now?");
                                            lv_label_set_text(id(confirm_ok_lbl), "Reboot");
                                            lv_obj_clear_flag(id(confirm_modal), LV_OBJ_FLAG_HIDDEN);
                                    widgets:
                                      - label: {text: "Reboot", text_font: roboto_16, text_color: 0xFF8888, align: CENTER}

                    # ---- Features subpage (overlays full content_cfg area) ----
                    # Sound | Plate Clear confirmation toggle.
                    - obj:
                        id: content_features
                        x: 0
                        y: 0
                        width: 480
                        height: 250
                        bg_color: 0x12121A
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        hidden: true
                        widgets:
                          # Header with back button
                          - obj:
                              x: 0
                              y: 0
                              width: 480
                              height: 28
                              styles: sty_bar
                              scrollbar_mode: "OFF"
                              widgets:
                                - button:
                                    x: 0
                                    y: 0
                                    width: 40
                                    height: 28
                                    bg_opa: TRANSP
                                    border_width: 0
                                    radius: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'lv_obj_add_flag(id(content_features), LV_OBJ_FLAG_HIDDEN);'
                                    widgets:
                                      - label: {text: "\U000F0141", text_font: mdi_24, text_color: 0x7B9EFF, align: CENTER}
                                - label:
                                    x: 0
                                    width: 480
                                    text: "Features"
                                    text_font: roboto_20
                                    text_color: 0x7B9EFF
                                    text_align: CENTER
                                    align: CENTER
                          # Separator
                          - obj:
                              x: 0
                              y: 28
                              width: 480
                              height: 1
                              bg_color: 0x454572
                              bg_opa: COVER
                              border_width: 0
                              radius: 0
                              scrollbar_mode: "OFF"

                          # ---- Row: Sound on/off (Off | On segments) ----
                          - obj:
                              x: 0
                              y: 36
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 130
                                    text: "Sound"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - button:
                                    id: btn_sound_off
                                    x: 150
                                    y: 3
                                    width: 158
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'id(sound_enabled) = 0;'
                                        - script.execute: update_sound_btn
                                    widgets:
                                      - label: {id: lbl_sound_off, text: "Off", text_font: roboto_16, text_color: 0x8888AA, align: CENTER}
                                - button:
                                    id: btn_sound_on
                                    x: 312
                                    y: 3
                                    width: 158
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'id(sound_enabled) = 1;'
                                        - script.execute: update_sound_btn
                                    widgets:
                                      - label: {id: lbl_sound_on, text: "On", text_font: roboto_16, text_color: 0x8888AA, align: CENTER}

                          # ---- Row: Confirm Plate Clear on/off (Off | On segments) ----
                          - obj:
                              x: 0
                              y: 78
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 130
                                    text: "Plate Clear"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - button:
                                    id: btn_plateclear_off
                                    x: 150
                                    y: 3
                                    width: 158
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'id(plate_clear_confirm_enabled) = 0;'
                                        - script.execute: update_plateclear_btn
                                    widgets:
                                      - label: {id: lbl_plateclear_off, text: "Off", text_font: roboto_16, text_color: 0x8888AA, align: CENTER}
                                - button:
                                    id: btn_plateclear_on
                                    x: 312
                                    y: 3
                                    width: 158
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'id(plate_clear_confirm_enabled) = 1;'
                                        - script.execute: update_plateclear_btn
                                    widgets:
                                      - label: {id: lbl_plateclear_on, text: "On", text_font: roboto_16, text_color: 0x8888AA, align: CENTER}

                    # ---- Sleep settings subpage (nested — opened from within
                    #      content_system; overlays the full content_cfg area) ----
                    - obj:
                        id: content_sleep
                        x: 0
                        y: 0
                        width: 480
                        height: 250
                        bg_color: 0x12121A
                        bg_opa: COVER
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        hidden: true
                        widgets:
                          # Header with back button
                          - obj:
                              x: 0
                              y: 0
                              width: 480
                              height: 28
                              styles: sty_bar
                              scrollbar_mode: "OFF"
                              widgets:
                                - button:
                                    x: 0
                                    y: 0
                                    width: 40
                                    height: 28
                                    bg_opa: TRANSP
                                    border_width: 0
                                    radius: 0
                                    pad_all: 0
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: 'lv_obj_add_flag(id(content_sleep), LV_OBJ_FLAG_HIDDEN);'
                                    widgets:
                                      - label: {text: "\U000F0141", text_font: mdi_24, text_color: 0x7B9EFF, align: CENTER}
                                - label:
                                    x: 0
                                    width: 480
                                    text: "Sleep Settings"
                                    text_font: roboto_20
                                    text_color: 0x7B9EFF
                                    text_align: CENTER
                                    align: CENTER
                          # Separator
                          - obj:
                              x: 0
                              y: 28
                              width: 480
                              height: 1
                              bg_color: 0x454572
                              bg_opa: COVER
                              border_width: 0
                              radius: 0
                              scrollbar_mode: "OFF"

                          # ---- Row: Inactivity timeout (-/value/+) ----
                          - obj:
                              x: 0
                              y: 36
                              width: 480
                              height: 38
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "OFF"
                              widgets:
                                - label:
                                    x: 14
                                    width: 130
                                    text: "Inactivity"
                                    text_font: roboto_16
                                    text_color: 0xAAAAAA
                                    align: LEFT_MID
                                - button:
                                    id: btn_sleep_dec
                                    x: 148
                                    y: 3
                                    width: 44
                                    height: 32
                                    styles: sty_card
                                    scrollbar_mode: "OFF"
                                    on_click:
                                      then:
                                        - lambda: |-
                                            int m = id(sleep_timeout_min);
                                            if (m == 0) return;
                                            else if (m <= 5) m = 0;
                                            else m -= 5;
                                            id(sleep_timeout_min) = m;
                                            id(update_sleep_timeout_lbl).execute();
                                    widgets:
                                      - label: {text: "-", text_font: roboto_20, text_color: 0xDDDDEE, align: CENTER}
                                - label:
                                    id: lbl_sleep_timeout
                                    x: 196
                                    width: 190
                                    text: "10 min"
                                    text_font: roboto_16
