# ============================================================================
# Device health — the diagnostics every ESPoolBuddy device reports to Home
# Assistant. Included by all three bundles. Consoles add the binary sensors in
# health_console.yaml; the scale's are in app_scale.yaml.
#
# Expects a time component (Last boot is a timestamp). Every entry point
# declares one (sntp_time).
# ============================================================================
sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    id: wifi_signal_sensor
    disabled_by_default: true
    update_interval: 300s

  # When the device last booted. Reset reason below says why.
  - platform: uptime
    name: "Last boot"
    id: uptime_sensor
    type: timestamp

# Why the device last restarted (power-on, software, panic, brownout,
# watchdog, ...). The debug component publishes it once at boot.
debug:
  update_interval: never

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"
